version: 2

goal:
  title: "Phase 2 Minimal Authoring Slice"
  slug: "phase2-authoring-slice"
  kind: existing_plan
  tranche: "Complete one typed keyframe-value/time authoring loop with in-memory history and Chrome proof, then stop for owner review."
  status: done
  oracle:
    signal: "Controlled Chrome proves that one neutral synthetic track can be edited through typed expected-revision operations, recompiled into the native preview, scrubbed, undone, and redone with deterministic bytes and atomic stale rejection."
    cadence: "after the Worker package and at final audit"
    final_proof: "A final Judge maps fresh operation, history, compiler, controlled-Chrome, interactive-Chrome, privacy, build, and repository evidence to every criterion and records full_outcome_complete: true."
  intake:
    original_request: "Continue with the recommended smallest Phase 2 authoring slice while keeping the approved phases intact."
    interpreted_outcome: "Prove practical CSS-animation creation and iteration through one safe canonical value/time edit loop without building later platform capabilities."
    input_shape: existing_plan
    audience: "Lineage Motion architecture owner"
    authority: approved
    proof_type: demo
    completion_proof: "The end-to-end edit, scrub, undo, redo, stale-reject, and deterministic-export loop passes automated and controlled Chrome evidence with no private leakage or scope expansion."
    likely_misfire: "A polished UI mutates local state or preview CSS directly, bypasses typed canonical operations/compiler output, or grows into persistence or a generalized editor."
    blind_spots_considered:
      - "Time representation, ordering, and collisions must be decided before implementation."
      - "Undo/redo must preserve revision and byte-identity guarantees."
      - "Intentional visual changes need bounded-difference proof, not false baseline-equivalence claims."
      - "Keyboard access and reduced-motion inspection are part of the usable edit loop."
      - "The private acceptance corpus remains read-only and outside tracked evidence."
    existing_plan_facts:
      - "Phase 0/read-only Phase 1 is complete at de300e6."
      - "The editor and future agent interfaces must share typed domain operations."
      - "Mutations require expected revisions and stale mutations fail atomically."
      - "Selectors are bindings rather than identity."
      - "Preview uses deterministic compiler output and browser-created animations."
      - "No persistence, CLI, MCP, claims, adapters, publication, push, or pull request is authorized."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase2-authoring-slice/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase2-authoring-slice"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the Phase 2 boundary and define the exact typed operation, timing, revision, history, visual-proof, and Worker file contracts before implementation."
    inputs:
      - "docs/incubation-plan.md"
      - "docs/architecture.md"
      - "docs/goals/phase0-readonly-phase1/goal.md"
      - "docs/goals/phase0-readonly-phase1/state.yaml"
      - "docs/goals/phase2-authoring-slice/goal.md"
      - "Existing domain, compiler, editor, and proof contracts"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the smallest credible authoring slice and stop at its owner-review boundary."
      - "Choose explicit canonical time/offset semantics, collision behavior, operation envelopes, revision transitions, undo/redo semantics, and diagnostic codes."
      - "Require the UI and any future interface to share one typed domain-operation boundary without building a CLI, MCP, service, or adapter."
      - "Reject importer expansion, direct preview mutation, JavaScript interpolation, persistence, generalized authoring, landing-animation work, or tracked private evidence."
      - "State the user-facing claim, top three realistic failure modes, and direct evidence needed to defeat each."
    expected_output:
      - "Go/no-go decision"
      - "Validated or corrected operation and history contract"
      - "Exact Worker objective and allowed_files"
      - "Exact focused and full verification commands"
      - "Controlled and interactive Chrome evidence contract"
      - "Stop conditions, deferred scope, and evidence gaps"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Go, with one necessary correction: monotonically advancing revisions make full document bytes intentionally differ after undo, so byte-identity claims must compare revision-neutral canonical content bytes and export bytes. The bounded slice can safely add typed opacity-value and integer-master-time edits, in-memory replay history, recompilation, and Chrome proof without persistence or importer expansion. The leading risks are UI or preview bypass of the domain/compiler path, stale/history corruption hidden by revision bytes, and unbounded CSS or scope leakage. The Worker package below defeats these directly and stops at owner review."
      worker_package:
        task_id: T002
        objective: "Implement one complete neutral authoring loop: select the preview fixture's uniquely bound opacity track, change its first keyframe value from 0 to 0.25, move its terminal keyframe from master time 2520 ms to 2180 ms, dispatch every edit and history action through the typed expected-revision domain boundary, recompile through the existing compiler, remount exact compiled bytes in the native preview, and prove stale rejection, undo/redo content identity, deterministic output, accessibility, visual containment, privacy, and phase safety."
        operation_contract:
          envelope:
            schemaVersion: motion.operation.v1
            operationId: "Caller-supplied stable ID matching [A-Za-z0-9._:-]{1,128}."
            documentId: "Must equal the canonical documentId."
            expectedRevision: "Nonnegative safe integer that must exactly equal the current document revision."
            kinds:
              - motion.keyframe-value.set
              - motion.keyframe-time.set
              - motion.history.undo
              - motion.history.redo
          edit_target:
            elementId: "Stable canonical element ID; selectors are never accepted."
            trackId: "Stable expanded-track ID belonging to elementId."
            keyframeId: "Stable rule-keyframe ID listed by trackId."
          value_operation: "Payload is {value:number}. This slice supports only finite opacity values from 0 through 1 with at most six decimal places. Store a deterministic non-exponent canonical decimal string. Any other property or grammar fails visibly; there is no CSS-string escape hatch."
          time_operation: "Payload is {timeMs:number}. timeMs must be an integer master time. Resolve effective delay from the target binding's delayOverridesMs and duration from its active slot; derive offset=(timeMs-delayMs)/durationMs. Accept only offsets in [0,1] exactly representable in integer millionths, then store offsetPpm/1000000."
          shared_rule_guard: "An editable rule/property must resolve to exactly one expanded canonical track. If another expanded track shares the rule/property, reject rather than silently changing multiple elements."
          diagnostic_precedence:
            - AUTHORING_ENVELOPE_INVALID
            - AUTHORING_DOCUMENT_MISMATCH
            - AUTHORING_OPERATION_ID_REUSED
            - AUTHORING_STALE_REVISION
            - AUTHORING_REVISION_EXHAUSTED
            - AUTHORING_ELEMENT_NOT_FOUND
            - AUTHORING_TRACK_NOT_FOUND
            - AUTHORING_TRACK_ELEMENT_MISMATCH
            - AUTHORING_KEYFRAME_NOT_FOUND
            - AUTHORING_KEYFRAME_TRACK_MISMATCH
            - AUTHORING_SHARED_RULE_UNSUPPORTED
            - AUTHORING_PROPERTY_UNSUPPORTED
            - AUTHORING_VALUE_INVALID
            - AUTHORING_TIME_UNSUPPORTED
            - AUTHORING_TIME_OUT_OF_RANGE
            - AUTHORING_TIME_PRECISION_UNREPRESENTABLE
            - AUTHORING_TIME_COLLISION
            - AUTHORING_TIME_ORDER_INVALID
            - AUTHORING_HISTORY_EMPTY
            - AUTHORING_HISTORY_REPLAY_INVALID
          atomicity: "Every rejection returns one deterministic sanitized error diagnostic and changes no document field, revision, operation-ID set, undo/redo stack, compiler bytes/receipt, iframe srcdoc, native animation state, selection, or visible success state. Successful operations return a new immutable state."
        timing_collision_contract:
          canonical_semantics: "Operation input and UI display use integer master milliseconds; canonical keyframes retain normalized offsets quantized to integer millionths. Timeline time is effective binding delay plus offset times slot duration."
          range: "The new master time must fall within the target slot's inclusive active interval."
          ordering: "Keyframe offsets remain strictly increasing. Equality with another keyframe is AUTHORING_TIME_COLLISION; crossing a neighbor is AUTHORING_TIME_ORDER_INVALID. No sorting, merging, nudging, clamping, or coercion is permitted."
          unsupported_cases: "Reject zero-duration slots, non-integer current target times needed for inverse replay, shared rules, iterations requiring ambiguous occurrence selection, or offsets not exactly representable in millionths."
        revision_history_contract:
          revision_location: "MotionDocument.revision remains the in-memory optimistic-concurrency revision and changes independently of content identity."
          revision_transitions:
            - "Initial imported document is revision 0."
            - "Each successful value edit, time edit, undo, or redo increments revision exactly once."
            - "Rejected commands do not change revision."
            - "Revision overflow rejects atomically."
          content_identity: "Add an explicitly named revision-neutral canonical-content serialization/digest for content comparisons. Keep the existing full canonical serialization revision-bearing. Do not claim full document bytes are equal across monotonic undo/redo revisions."
          history_replay: "Store immutable forward and inverse typed edit records. Undo and redo apply the inverse or forward record through the same target resolution, validation, and mutation reducer as direct edits; snapshot assignment is not an alternate mutation path."
          operation_ids: "Accepted public operation IDs remain consumed for the session. Reuse rejects atomically. Rejected IDs are not recorded because a rejected operation must leave state unchanged."
          redo_rules: "A successful new edit after undo clears redo. A rejected edit after undo preserves redo. Empty undo or redo rejects with AUTHORING_HISTORY_EMPTY."
          required_sequence:
            - "S0 revision 0: initial content/export."
            - "S1 revision 1: value edit."
            - "S2 revision 2: time edit."
            - "A unique stale edit expecting revision 1 rejects and leaves S2 unchanged."
            - "U1 revision 3: first undo has content/export bytes equal to S1."
            - "U2 revision 4: second undo has content/export bytes equal to S0."
            - "R1 revision 5: first redo has content/export bytes equal to S1."
            - "R2 revision 6: second redo has content/export bytes equal to S2."
        editor_contract:
          - "Track and keyframe selection use keyboard/pointer-operable native controls exposing elementId, trackId, keyframeId, property, current value/time, and revision."
          - "Labeled numeric value/time inputs dispatch typed operations; the UI never edits canonical objects, iframe styles, keyframe CSS, or per-frame properties directly."
          - "Undo and redo dispatch typed history commands. Success and error output is visible and announced through an appropriate live region."
          - "Every successful command compiles the returned canonical document using the existing deterministic compiler and mounts compiled.html through NativePreviewController. Rejected commands do not compile or remount."
          - "Play, pause, and scrub continue to operate only on browser-created CSSAnimation objects and currentTime."
          - "Reduced-motion inspection remains available and unchanged. No service, storage, CLI, MCP, adapter, generalized timeline, drag framework, easing editor, free-form CSS editor, or importer capability is added."
        visual_proof_contract:
          controlled_chromium:
            - "Capture S0, S1, S2, U1, U2, R1, and R2 using repository-pinned Playwright Chromium at a declared viewport with DOM/font/layout readiness and zero live network."
            - "Sample the selected opacity track at 820 ms, immediately before and after its new 2180 ms terminal keyframe, immediately before and after its old 2520 ms terminal keyframe, and stable start/end samples."
            - "Prove intended changed pixels remain within the selected element's bounding-box union plus a declared two-pixel antialias margin; require zero changed pixels outside that region and unchanged computed properties on non-target elements."
            - "Sample both valid t-1 ms and t+1 ms sides of every unaffected discrete/steps boundary. Record endpoint handling, preserve the expected transition, and prove no unexpected non-target difference."
            - "U2 screenshots/hashes must equal S0 at every sample; U1 must equal S1; R1 must equal S1; R2 must equal S2. Revision-neutral canonical content and export bytes must match their corresponding states."
            - "At S0, S1, and S2, run compilation three times and require byte-identical HTML, CSS, export digest, and compiler receipt within each equal-revision state."
          interactive_chrome:
            - "Exercise pointer selection, keyboard-only selection and activation, value edit, time edit, scrub to edited moments, play, pause, stale rejection, two undos, two redos, redo clearing after a divergent edit, reduced-motion inspection, visible status, and focus continuity."
            - "Assert iframe.srcdoc equals the latest compiler html after success and remains byte-identical after rejection; all preview animations are CSSAnimation instances; no direct style mutation or JavaScript interpolation occurs."
            - "Require zero console errors, zero failed or live network requests, and a sanitized Chrome receipt recording browser identity, viewport, operation/revision sequence, digests, counts, and boolean checks without selectors, paths, copy, or screenshots."
        allowed_files:
          - package.json
          - package-lock.json
          - "packages/domain/src/**"
          - "packages/css-compiler/src/**"
          - "packages/preview-runtime/src/**"
          - "packages/visual-proof/src/**"
          - "apps/editor/src/**"
          - apps/editor/tests/editor.spec.ts
          - apps/editor/scripts/qa-chrome.mjs
          - fixtures/public-synthetic/preview.html
          - docs/evidence/t002-phase2-authoring.json
          - "artifacts/**"
        verify:
          - "npm exec vitest run packages/domain/src/authoring.test.ts packages/domain/src/domain.test.ts packages/css-compiler/src/determinism.test.ts packages/preview-runtime/src/index.test.ts"
          - "npm exec playwright test --config apps/editor/playwright.config.ts apps/editor/tests/editor.spec.ts"
          - "npm exec vitest run packages/visual-proof/src/authoring.visual.test.ts"
          - "npm run qa:chrome"
          - "npm run test:unit"
          - "npm run verify:determinism"
          - "npm run test:browser"
          - "npm run test:visual"
          - "npm run test:private-acceptance"
          - "npm run verify:receipts"
          - "npm run check:private-ignore"
          - "npm run check:sensitive"
          - "npm run typecheck"
          - "npm run build"
          - "node --version && npm --version && npm exec playwright -- --version"
          - "git diff de300e6 --check"
          - "git status --short"
        stop_if:
          - "Implementation needs any file outside allowed_files."
          - "The browser cannot invoke the exact domain reducer and deterministic compiler without introducing a service, direct preview mutation, a second compiler/interpolator, or weakening SHA-256 receipt semantics."
          - "The selected target is not a uniquely expanded opacity track with integer, millionth-representable current and requested master times."
          - "Any operation needs selector identity, free-form CSS, silent coercion, rule cloning, importer expansion, persistence, or generalized authoring."
          - "Undo/redo cannot use the same mutation reducer while preserving monotonic revisions and revision-neutral content/export identity."
          - "A rejected operation changes any observable domain, history, compiler, iframe, preview, or UI-success state."
          - "Controlled proof cannot isolate intentional target-region differences or cannot account for both sides of unaffected discrete/steps boundaries."
          - "Private acceptance requires changing private source, tracked private evidence, Phase 1 corpus contracts, or disclosing paths, selectors, copy, branding, media, or screenshots."
          - "A browser-safe digest change does not preserve existing SHA-256 outputs exactly."
          - "The same verification failure remains unexplained after two attempts."
      evidence:
        - "Phase 0/read-only Phase 1 is complete at de300e6; its final receipt proves 9 rules, 8 applications, 9 slots, 20 tracks, deterministic native compilation, controlled Chromium, Chrome timing, and privacy gates."
        - "docs/incubation-plan.md authorizes human editing in Phase 2 but defers the sole-writer service, persistence, CLI, branches, claims, and adapters to later phases."
        - "packages/domain/src/index.ts currently fixes revision to literal 0, provides stable element/track/keyframe relationships, and serializes revision inside canonical bytes; the approved slice must correct the operation/revision boundary before edits."
        - "fixtures/public-synthetic/preview.html has one uniquely applied reveal opacity track with delay 820 ms and duration 1700 ms, allowing the exact 0-to-0.25 value edit and 2520-to-2180 ms time edit without shared-rule effects."
        - "apps/editor/src/main.ts is currently read-only, receives build-time compiled bytes, and uses NativePreviewController for exact srcdoc/native CSSAnimation control; this supplies the existing boundary but no authoring proof."
        - "packages/css-compiler/src/index.ts is deterministic and reconstructs motion from canonical records; it must remain the sole compilation path after edits."
        - "The current worktree is on codex/phase2-authoring-slice at de300e6 with only the Phase 2 goal-board directory untracked."
      subgoal_contract: null
      parallel_safety:
        safe: false
        reason: "One Worker must own the whole vertical slice. Domain serialization/revisions, compiler behavior, editor state, browser tests, and visual receipts are coupled shared boundaries, so disjoint allowed_files cannot prove independent correctness."
      blocked_tasks: []
      missing_evidence:
        - "No typed mutation or history implementation exists; MotionDocument revision currently accepts only 0."
        - "No direct evidence proves valid edit transitions, diagnostic precedence, atomic stale rejection, operation-ID reuse, collision/order handling, or redo invalidation."
        - "No browser evidence proves successful edits recompile and remount exact compiler bytes while rejected edits leave the iframe unchanged."
        - "No bounded-difference controlled visual proof, undo/redo state-hash proof, accessible authoring walkthrough, or Phase 2 sanitized receipt exists."
        - "Fresh full/private/safety/build verification has not run for the authoring slice."
      required_board_updates:
        - "Copy this worker_package into T002, including exact operation/timing/revision/history contracts, allowed_files, verify commands, visual-proof requirements, and stop_if conditions, before dispatch."
        - "Correct Phase 2 byte-identity wording: monotonic undo/redo revisions require revision-neutral canonical content bytes and export bytes to match prior states; full revision-bearing document bytes and compiler receipts may differ across revisions and must not be claimed equal."
        - "Require T002's receipt to record the S0/S1/S2/U1/U2/R1/R2 transition matrix, rejected-state before/after digests, three-run determinism, controlled Chromium containment, interactive Chrome, privacy, build, and complete-diff evidence."
        - "Keep T999 queued as the final milestone audit; it must freshly map the user-facing claim and the three leading failure modes to direct evidence and enforce the owner-review stop."
        - "Do not create a child board or parallel Worker task."
