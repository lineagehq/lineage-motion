  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Diagnose the repeated controlled-Chromium early-frame mismatch between revision-neutral/content-identical history states and define the smallest safe corrective Worker package without weakening proof thresholds."
    inputs:
      - "T001 and T002 receipts"
      - "packages/visual-proof/src/authoring.visual.test.ts"
      - "Current T002 implementation diff"
      - "Exact focused test output reproducible from T002"
    constraints:
      - "Read-only; do not implement."
      - "Distinguish product-state corruption from browser animation readiness, capture ordering, font/layout, and screenshot nondeterminism."
      - "Do not relax hash equality for content-identical S0/U2, S1/U1/R1, or S2/R2 states."
      - "Do not broaden into importer changes, persistence, generalized editing, or a second animation engine."
      - "Define exact allowed_files, verification, stop conditions, and evidence for a corrective Worker."
    expected_output:
      - "Root-cause decision or bounded diagnostic hypothesis"
      - "Approved corrective Worker package"
      - "Exact proof that retains the original oracle"
      - "Required board updates and remaining evidence"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The evidence supports a bounded capture-readiness defect, not canonical/history corruption. Before capture, the test proves revision-neutral content and export identity. Across two fresh runs, only the first four nonzero capture ordinals differ, the later 19 hashes match, and the two early hash sets swap between equivalent states. Each state uses a fresh context, but captureState omits the existing harness’s three-consecutive-layout readiness and does not prove raster convergence. Approve one proof-only correction that adds deterministic DOM/font/layout/animation and raster readiness while retaining independent captures and exact hash equality. Completion remains unavailable until this proof and all deferred T002 verification pass."
      worker_package:
        task_id: T004
        objective: "Correct only the controlled Phase 2 authoring capture harness: independently capture S0, S1, S2, U1, U2, R1, and R2 after explicit DOM/font/layout/native-animation readiness and exact raster convergence, retain byte-for-byte hash equality for content-identical states, preserve all sample times and containment thresholds, then run the complete deferred T002 verification suite."
        root_cause_decision:
          classification: "bounded browser capture-readiness hypothesis"
          product_state_status: "No product-state corruption is evidenced before capture: revision-neutral canonical bytes and export digests already match for U1/S1, U2/S0, R1/S1, and R2/S2."
          observed_pattern: "Two fresh focused runs each produced 23 hashes per state. Index 0 and the final 18 hashes matched; only indices 1-4 differed. The same two four-hash sequences swapped between the equivalent expected/actual states on the second run."
          likely_mechanism: "Each state opens a fresh browser context. captureState waits for fonts and animation.ready but omits the established three-consecutive-layout readiness loop and takes a measured screenshot after only two animation frames. Early captures can therefore observe context-local compositor/raster warm-up for subpixel transformed native animations."
          confidence: "bounded, not conclusive; the corrective evidence must distinguish layout/animation instability from raster instability and must stop if independent converged captures still differ."
