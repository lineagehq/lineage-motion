version: 2

goal:
  title: "Phase 3 control recovery and refresh hardening"
  slug: phase3-control-recovery
  kind: existing_plan
  tranche: "Implement and prove only approved Phase 3 Slice 3."
  status: done
  oracle:
    signal: "A real CLI commit, crash/lost-response matrix, and two-editor Chrome walkthrough prove durable recovery, ordered reconnect, immutable refetch, stable-ID reconciliation, and visible dirty-draft conflicts without silent overwrite."
    cadence: "after the Worker package and at final audit"
    final_proof: "Receipt-backed recovery, service, parity, browser, Chrome, determinism, integrity, migration, and privacy evidence with full_outcome_complete: true for Slice 3."
  intake:
    original_request: "Create a fresh worktree and implement Phase 3 Slice 3 control recovery and refresh hardening, then stop for architecture review."
    interpreted_outcome: "The existing durable branch-and-claim editor safely recovers from control crashes and lost responses and reconciles ordered remote CLI changes without silently overwriting local drafts."
    input_shape: existing_plan
    audience: "motion editor owner"
    authority: approved
    proof_type: test
    completion_proof: "Final Judge accepts the exact crash, recovery, refresh, Chrome, privacy, and scope evidence for Slice 3 only."
    likely_misfire: "Adding generic collaboration or merely reconnecting SSE without proving dirty-draft safety, stable identity, and durable control recovery."
    blind_spots_considered:
      - "Event gaps, duplicate delivery, reconnect ordering, and explicit-refetch fallback"
      - "Dirty drafts whose target changes or disappears during remote refresh"
      - "Crash and lost-response atomicity across every branch and claim control"
      - "Migration rollback, corruption refusal, and branch-head digest verification"
      - "Capability or claim-secret leakage through recovery logs and browser state"
    existing_plan_facts:
      - "Slice 1 durable authoring and Slice 2 minimum branches/claims are merged at e07a187."
      - "The approved architecture assigns the full control crash matrix, SSE replay/refetch, stable-ID reconciliation, dirty-draft conflicts, integrity checks, and migration failure behavior to Slice 3."
      - "Slice 4 owns aggregate Phase 3 proof and must not be pulled forward as product scope."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase3-control-recovery/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase3-control-recovery"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the merged Slice 2 baseline and ground one largest-safe Slice 3 Worker contract from the approved architecture."
    inputs:
      - "docs/architecture/phase3-persistence-boundary.md"
      - "Merged Slice 2 implementation and receipts"
    constraints:
      - "Read-only; do not implement."
      - "Ground current implementation truth instead of assuming the architecture is already implemented."
      - "Preserve the sole-writer, strict protocol, expected-revision, verifier-only secret, stable-ID, compiler-preview, determinism, and reduced-motion invariants."
      - "Exclude Slice 4, merge/review, annotations, claim listing, generalized collaboration, MCP, Lineage, publication, Phase 4+, and dependency additions."
    expected_output:
      - "Baseline implementation and evidence gap map"
      - "Exact crash/lost-response matrix and durable replay/refetch contract"
      - "Largest-safe coherent Worker objective"
      - "Exact allowed_files, verify commands, stop_if conditions, and Chrome walkthrough"
      - "Top three realistic failure modes and direct falsification requirements"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approved one coherent Slice 3 vertical package. Slice 2 is healthy, but real process recovery covers all four kill points only for authoring; branch/claim recovery is partial. SSE is memory-only and cursorless, reads/events are unauthenticated, and editor refresh can race, overwrite dirty controls, and clear disappeared selections. The existing events table already supplies durable commit_seq, so the full five-control matrix, replay/refetch, authentication, and reconciliation fit one bounded package without a schema migration or dependency."
      evidence:
        - "Fresh baseline passed service 12/12, recovery 12/12, parity 12/12, and typecheck."
        - "The four real SIGKILL points currently cover only motion.track.create; branch/claim recovery has migration, lost acquire, and restart examples rather than the required 20 cells."
        - "The events table has durable commit_seq but ProjectStore exposes no replay query; SSE publishes no event ID and ignores reconnect cursors."
        - "Head, immutable revision, document revision, and event reads are unauthenticated."
        - "Editor callbacks are not serialized; refresh hydration rewrites drafts and missing selected canonical IDs are silently cleared."
        - "Startup branch verification uses an inner join, so a dangling head can disappear instead of failing closed."
      parallel_safety:
        one_worker_package_safe: true
        parallel_workers_safe: false
        reason: "Store fault points, durable sequencing, authenticated streaming, shared-client cursor semantics, editor reconciliation, and browser proof share one transaction-to-render contract."
      blocked_tasks:
        - T003
        - T999
      missing_evidence:
        - "A 20-cell real-process branch/claim fault matrix plus five lost-response exact retries."
        - "Integrity, migration rollback, corrupt/dangling-head refusal, and restart proof."
        - "Authenticated ordered replay/refetch, duplicate/gap handling, two-editor CLI refresh, dirty-draft and stable-ID browser proof."
        - "Exact native preview, reduced motion, deterministic, privacy, and complete-diff evidence."
      required_board_updates:
        - "Mark T001 done and copy the exact Worker package to T002."
        - "Activate T002 as the sole Worker; keep T003 and T999 queued."
      worker_package:
        objective: "Implement and prove the complete Phase 3 Slice 3 control-recovery and refresh-hardening vertical slice. Extend real-process recovery to branch creation and claim acquire, renew, release, and human revoke at after-begin, after event/state inserts, before commit, and after commit before response; prove pre/post-only restart exposure, one durable transition, exact committed retry, no rejected-ID consumption, and recovery of committed notifications lost with the response. Add authenticated durable metadata-only SSE replay by commit_seq with race-safe initial head sync, cursor continuation, serialized reconciliation, duplicate suppression, gap-triggered immutable head refetch, digest validation, and cross-branch isolation. Preserve dirty form and creation drafts visibly across conflicting CLI revisions, mark their base stale, never auto-submit/replay/overwrite/discard them, and provide explicit keep/discard resolution. Reconcile track, keyframe, and creation selection only by canonical IDs, retaining visible unavailable anchors when targets disappear and restoring them only when the same IDs return. Prove connected and disconnected/reconnected refresh using the real CLI and two branch editors, exact compiler-native output, stable selection, reduced motion, zero browser errors, deterministic repetition, verifier-only secrets, and sanitized receipts. Preserve every Slice 0-2 invariant and exclude Slice 4 and later scope."
