version: 2

goal:
  title: "Phase 3 durable vertical slice"
  slug: "phase3-durable-vertical-slice"
  kind: existing_plan
  tranche: "Implement and prove the complete first Phase 3 service-to-SQLite-to-CLI/editor-to-SSE-to-compiler-preview vertical path."
  status: done
  oracle:
    signal: "A clean synthetic store proves identical editor/CLI typed-operation results, one atomic durable revision, deterministic sanitized output, restart recovery, post-commit SSE refresh, and exact compiler-backed Chrome preview behavior."
    cadence: "after each coherent Worker package and at milestone/final audits"
    final_proof: "Receipt-backed service, recovery, parity, browser, Chrome, determinism, privacy, and protected-diff evidence with full_outcome_complete: true for this slice."
  intake:
    original_request: "Implement the documented Phase 3 end-to-end first slice now in a dedicated worktree."
    interpreted_outcome: "One existing authoring operation works durably and identically through editor and CLI, refreshes the compiler-backed preview, and survives adversarial persistence checks."
    input_shape: existing_plan
    audience: "Product owner and the following Phase 3 tranche"
    authority: approved
    proof_type: test
    completion_proof: "Executable synthetic end-to-end proof plus adversarial service, restart, parity, Chrome, privacy, and repository gates."
    likely_misfire: "Building generalized persistence helpers without a complete working editor/CLI/live-preview path, or implementing branches and claims early."
    blind_spots_considered:
      - "Hidden second SQLite writer"
      - "Non-atomic stale or faulted transaction"
      - "Lost-response idempotency failure"
      - "Editor/CLI protocol drift"
      - "Unsafe dirty-draft reconciliation"
      - "Client-side duplicate persistence"
      - "Sensitive material in local stores, logs, fixtures, or receipts"
      - "Sibling-worktree raster discovery in the broad unit command"
    existing_plan_facts:
      - "docs/architecture/phase3-persistence-boundary.md is authoritative."
      - "The first slice is end to end through CLI, editor, SSE, and compiler-backed preview."
      - "Branches and claims are deferred to the second implementation slice."
      - "Post-persistence Chrome QA is mandatory."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase3-durable-vertical-slice/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase3-durable-vertical-slice"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved architecture against current repository reality and specify the largest safe end-to-end Worker package for the complete first Phase 3 slice."
    inputs:
      - "docs/architecture/phase3-persistence-boundary.md"
      - "docs/incubation-plan.md"
      - "AGENTS.md"
      - "package.json and lockfile"
      - "Current domain, editor, compiler, preview, browser QA, and repository-safety surfaces"
    constraints:
      - "Read-only."
      - "Do not implement or edit files."
      - "Preserve the complete end-to-end slice; do not reduce it to service-only scaffolding."
      - "Do not include branches, claims, or Phase 4+ behavior."
      - "Resolve the SQLite runtime choice from lockfile/platform reality without adding a generalized adapter ecosystem."
      - "Specify an honest main-worktree-only nonvisual gate that avoids sibling-worktree raster discovery."
    expected_output:
      - "Architecture-to-current-code gap map"
      - "Exact Worker objective"
      - "Allowed files"
      - "Test-first sequence and exact verify commands"
      - "Stop conditions"
      - "Top three realistic failure modes and proof plan"
      - "Decision on whether one Worker package is safe or a bounded two-milestone sequence is required"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Repository reality supports one coherent Worker package. The strict canonical-ID reducer, deterministic compiler, and native preview already exist; the missing protocol, sole-writer service, SQLite store, CLI, SSE, and durable editor path are tightly coupled and share files, so splitting at service scaffolding would create the documented misfire. Use built-in node:sqlite on the verified Node 22.22.3 Darwin arm64 runtime and /usr/bin/lockf for the pre-listen advisory lock. Keep a fixed main head only; branch creation, claims, replay hardening, and Phase 4+ remain excluded."
      evidence:
        - "Architecture lines 312-320 define this exact end-to-end slice and exclude branch creation and claims; lines 321-329 defer those controls and refresh hardening."
        - "The runtime is Node v22.22.3 on Darwin arm64; node:sqlite DatabaseSync was successfully exercised, no SQLite package is locked, and /usr/bin/lockf supports nonblocking pre-listen locking."
        - "The domain already provides strict expected-revision, operation-ID, canonical-ID motion.track.create reduction and deterministic canonical bytes."
        - "The compiler and NativePreviewController already produce and mount exact browser-native HTML/CSS using iframe.srcdoc and browser-created animations."
        - "The editor currently owns an in-memory AuthoringState and calls the reducer directly; no shared client, immutable service refetch, or SSE subscription exists."
        - "No protocol, ProjectStore, SQLite service, CLI, recovery, parity, or Phase 3 scripts currently exist."
        - "The exact current-worktree nonvisual command passed 8 files and 134 tests; typecheck and build also passed. The broad packages-glob unit command is not an authoritative gate."
        - "Top risks are hidden/non-atomic writers, crash or lost-response idempotency failure, and editor/CLI/refresh drift or private leakage; the Worker verification directly tests each."
      worker_package:
        objective: "Implement and prove the complete first Phase 3 durable authoring path as one vertical package: wrap the existing canonical-ID motion.track.create operation in one shared motion.protocol.v1 schema/client; run one /usr/bin/lockf -kn protected loopback service as the only SQLite owner; persist a checksummed fixed-main seed, immutable revisions, private events, request digests, canonical digests, stored sanitized responses, and head advancement atomically through a first-slice ProjectStore using node:sqlite BEGIN IMMEDIATE, foreign_keys=ON, WAL, and synchronous=FULL; provide stable errors and CLI exit codes; invoke the same client through the actual CLI and editor; publish metadata only after commit; refetch the immutable revision and remount exact compiler output; prove concurrency, rejection invariance, idempotency, restart/lost-response behavior, editor/CLI byte parity, Chrome refresh, privacy, and protected-diff safety. Do not implement branch creation, claims, replay hardening, dirty-draft reconciliation, Phase 4+, or a second persistent writer."
        allowed_files:
          - package.json
          - tsconfig.json
          - apps/editor/vite.config.ts
          - apps/editor/playwright.config.ts
          - apps/editor/src/main.ts
          - apps/editor/src/global.d.ts
          - apps/editor/src/virtual.d.ts
          - apps/editor/src/styles.css
          - apps/editor/tests/editor.spec.ts
          - apps/editor/tests/phase3.spec.ts
          - apps/editor/scripts/serve-editor.mjs
          - apps/editor/scripts/qa-chrome.mjs
          - packages/domain/src/index.ts
          - packages/domain/src/authoring.test.ts
          - packages/motion-protocol/src/index.ts
          - packages/motion-protocol/src/index.test.ts
          - packages/project-store/src/index.ts
          - packages/local-service/src/index.ts
          - packages/local-service/src/lock-runner.ts
          - packages/local-service/src/migrations.ts
          - packages/local-service/src/paths.ts
          - packages/local-service/src/seed.ts
          - packages/local-service/src/sqlite-project-store.ts
          - packages/local-service/src/test-support.ts
          - packages/local-service/src/service.test.ts
          - packages/local-service/src/recovery.test.ts
          - packages/motion-cli/src/cli.ts
          - packages/phase3-proof/src/parity.test.ts
          - packages/phase3-proof/src/privacy.test.ts
        verify:
          - "npm run test:phase3:service"
          - "npm run test:phase3:recovery"
          - "npm run test:phase3:parity"
          - "npm run test:phase3:browser"
          - "npm run qa:chrome"
          - "repo_root=$(git rev-parse --show-toplevel) && npm exec vitest -- run --root \"$repo_root\" \"$repo_root/packages/domain/src/domain.test.ts\" \"$repo_root/packages/domain/src/authoring.test.ts\" \"$repo_root/packages/domain/src/repository-safety.test.ts\" \"$repo_root/packages/css-import/src/import.test.ts\" \"$repo_root/packages/css-import/src/materialize.test.ts\" \"$repo_root/packages/css-compiler/src/determinism.test.ts\" \"$repo_root/packages/preview-runtime/src/index.test.ts\" \"$repo_root/packages/visual-proof/src/index.test.ts\" \"$repo_root/packages/motion-protocol/src/index.test.ts\" \"$repo_root/packages/local-service/src/service.test.ts\" \"$repo_root/packages/local-service/src/recovery.test.ts\" \"$repo_root/packages/phase3-proof/src/parity.test.ts\" \"$repo_root/packages/phase3-proof/src/privacy.test.ts\" --sequence.concurrent false"
          - "npm run verify:determinism"
          - "npm run test:browser"
          - "npm run typecheck"
          - "npm run build"
          - "npm run verify:phase3"
          - "npm run check:sensitive"
          - "npm run check:private-ignore"
          - "git diff --check"
          - "git diff --exit-code -- package-lock.json AGENTS.md docs/architecture/phase3-persistence-boundary.md docs/incubation-plan.md fixtures packages/css-import packages/css-compiler packages/preview-runtime packages/visual-proof scripts"
          - "git status --short"
        stop_if:
          - "node:sqlite cannot satisfy the required file-backed transaction, WAL, FULL synchronous, backup, or restart semantics on the locked Node >=22.22 runtime."
          - "/usr/bin/lockf -kn cannot hold the store-adjacent advisory lock across the service child lifetime or cannot reject a second service before it listens."
          - "Implementation would require a SQLite npm dependency, package-lock.json change, generalized store-adapter ecosystem, or any SQLite import outside packages/local-service/src/sqlite-project-store.ts."
          - "Implementation requires branch creation, claims, leases, SSE replay, dirty-draft reconciliation, MCP, Lineage integration, video, publication, Phase 4+, or another persistent writer."
          - "The editor, CLI, compiler, or preview would open SQLite, use localStorage/indexedDB, persist a canonical document, or treat an unfetched client projection as committed truth."
          - "A private fixture, corpus path, tracked database/WAL/backup/discovery artifact, raw payload receipt, credential, URL, selector, absolute path, or screenshot would be required."
          - "Existing visual or deterministic proof must be weakened, deleted, skipped, or replaced to make the new gate pass."
          - "Required work falls outside the exact allowed_files list."
          - "A focused verification command fails twice for the same unresolved product cause."
      parallel_safety:
        one_worker_package_safe: true
        parallel_workers_safe: false
        reason: "Protocol, transaction, editor, SSE, CLI, and parity surfaces overlap; a service-only split would not satisfy the oracle."
      missing_evidence:
