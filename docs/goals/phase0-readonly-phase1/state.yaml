      - "Successful private import requires unsupported_count=0 and missing_count=0."
      - "Record meaningful failing-test and passing-test evidence for schema validation, selector-independent stable identity, complete inventories, atomic failure, and deterministic compilation."
      - "The sensitive-content check must inspect tracked inventory, merge-base-to-HEAD diff, index, worktree, and untracked filenames/content while emitting only sanitized aggregates."
      - "Do not create service, persistence, CLI, operation, adapter, or Phase 2 packages."
    expected_output:
