  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit the blocked foundation and decide a deterministic, fail-closed policy for the private scene's single network font stylesheet import before implementation resumes."
    inputs:
      - "T002 receipt"
      - "Canonical schema and importer/compiler tests"
      - "Sanitized private acceptance receipt"
      - "Current branch diff"
      - "T002 blocker: one network font stylesheet import conflicts with blanket external-resource rejection and required clean private acceptance"
    constraints:
      - "Read-only."
      - "Reject opaque motion CSS, selector identity, partial unsupported imports, ungrounded counts, or unsanitized evidence."
      - "Map all findings to the user-facing import and export claims."
      - "Do not permit live network dependence in deterministic proof or production export."
      - "Prefer the smallest explicit resource-contract refinement that preserves fail-closed diagnostics and does not broaden motion syntax."
    expected_output:
      - "pass | reject"
      - "Inventory coverage matrix"
      - "Determinism evidence assessment"
      - "Approved font/resource policy or rejection rationale"
      - "Exact corrective Worker package for T002 foundation completion"
    receipt:
      result: done
      decision: rejected
      full_outcome_complete: false
      rationale: "T002 is rejected at this gate because its current private receipt correctly reports an atomic failure, not a successful foundation. The smallest acceptable refinement is an explicit pre-import materialization step: resolve exactly one font stylesheet from a digest-pinned, ignored offline bundle into self-contained font CSS, then pass the result through the unchanged fail-closed importer. The resolver must never fetch, must reject non-font CSS or incomplete assets, and must embed pinned font bytes so export and proof have no live dependency. This preserves narrow motion syntax, atomic diagnostics, deterministic bytes, and private safety while allowing unsupported_count=0 only after complete verified resolution."
      evidence:
        - "The current sanitized private receipt reports passed=false, ruleCount=9, applicationCount=8, slotCount=9, trackCount=20, supportedCount=46, unsupportedCount=1, missingCount=0, and diagnostic code IMPORT_EXTERNAL_RESOURCE."
        - "T002's receipt states that earlier 9-rule, 8-application, ordered-slot, stagger, two-step-slot, 20-track, and three-run determinism results were invalidated when strict external-resource enforcement was added."
        - "packages/css-import/src/index.ts currently inventories the complete motion surface before returning document=null whenever an external link, CSS @import, or non-data CSS URL produces an error diagnostic."
        - "packages/css-import/src/import.test.ts directly proves unresolved external stylesheets, scripts, @import rules, and non-data URLs fail atomically without a partial document."
        - "packages/css-compiler/src/index.ts reconstructs animation declarations and keyframes from canonical records and rejects opaque presentation animation CSS, but it does not yet prove that compiled output contains no live resource reference."
        - "Fresh read-only verification passed: npm run test:unit (19 tests), npm run verify:determinism, npm run check:private-ignore, npm run check:sensitive, npm run typecheck, and git diff --check."
        - "The fresh sensitive scan reported zero findings across tracked inventory, branch diff, index, worktree, and untracked surfaces; the private-ignore check reported all three private targets ignored and none tracked."
        - "The approved design permits opaque non-motion presentation CSS but requires scripts and unresolved external resources to fail closed, deterministic pure HTML/CSS export, font readiness, and zero-pixel controlled proof."
      resource_policy:
        status: approved
        name: offline-pinned-font-materialization-v1
        contract:
          - "Keep importMotionHtml fail closed for every unresolved external resource; do not add a permissive URL mode."
          - "Add a pure pre-import materializer whose only exception surface is exactly one HTML stylesheet link or top-level CSS @import explicitly classified as a font stylesheet."
          - "The materializer receives raw HTML plus an owner-provided offline resource lock from ignored .private-corpus storage. It performs no fetch, DNS, browser navigation, cache lookup, or fallback network request."
          - "The lock identifies the source reference by digest and pins the stylesheet bytes and every referenced font asset by SHA-256, MIME type, and deterministic ordinal. Raw URLs and local paths remain private inputs."
          - "Accept resolved stylesheet CSS only when it contains @font-face rules, comments, and an explicit allowlist of font-face descriptors. Reject ordinary selectors, nested @import, keyframes, animation declarations, conditional rules, scripts, local() sources, missing assets, digest mismatches, duplicate identities, and unrecognized constructs."
          - "Replace every font src candidate with its matching digest-verified data URL, remove the single external reference, and emit self-contained materialized HTML. No http:, https:, protocol-relative URL, @import, local(), or unresolved url() may survive."
          - "Record original-source, materialized-source, resource-lock, stylesheet, and aggregate font-asset digests separately. Canonical and compiler receipts must bind to these digests without exposing URLs, paths, font names, source text, or binary content."
          - "The controlled baseline must use the same pinned bytes with all unexpected network requests aborted. Export and preview must use the embedded materialized bytes. Resource retrieval may not occur during import, compilation, preview, tests, or proof."
      inventory_coverage:
        - construct: "keyframe rules"
          observed: 9
          required: 9
          status: "inventory observed; acceptance invalid until resource resolution succeeds"
        - construct: "animation applications"
          observed: 8
          required: 8
          status: "inventory observed; acceptance invalid until resource resolution succeeds"
        - construct: "ordered slots"
          observed: 9
          required: 9
          status: "count observed; order must be re-proven in the successful receipt"
        - construct: "element/property tracks"
          observed: 20
          required: "complete discovered inventory"
          status: "count observed; detailed sanitized inventory must be re-proven"
        - construct: "unsupported resources"
          observed: 1
          required: 0
          status: "blocking external font stylesheet"
        - construct: "missing motion constructs"
          observed: 0
          required: 0
          status: "observed but not sufficient for acceptance"
        - construct: "simultaneous and step-timed slots"
          observed: "previously reported as one two-slot application and two step-timed slots"
          required: "one two-slot application and two step-timed slots"
          status: "must be re-proven after successful atomic import"
        - construct: "three-run deterministic compilation"
          observed: "previous result invalidated"
          required: "byte-identical HTML, CSS, export digest, and compiler receipt"
          status: missing
      parallel_safety:
        safe: false
        reason: "The corrective package changes shared domain, importer, compiler, root verification, and private acceptance contracts. T004 must not consume these interfaces concurrently."
      blocked_tasks:
        - T004
      missing_evidence:
        - "No digest-pinned offline font stylesheet and asset lock has been validated."
        - "No successful private canonical document or passed sanitized private receipt exists under strict resource enforcement."
        - "No test proves unresolved, mismatched, incomplete, non-font, nested-import, local(), or motion-bearing resource bundles fail atomically with sanitized diagnostics."
        - "No compiler test proves production HTML/CSS contains no live network references after font materialization."
        - "Ordered slots, staggered delays, the simultaneous application, both step-timed slots, all 20 tracks, and three-run private determinism must be re-proven after resolution."
        - "Controlled Chromium has not yet proven that the offline-pinned baseline and compiled output load identical font bytes without network requests."
      required_board_updates:
        - "Keep T002 blocked and attach the corrective worker_package from this receipt; do not advance T004 until the corrected foundation passes a fresh Judge audit."
        - "Record offline-pinned-font-materialization-v1 as the sole narrow refinement to the design's external-resource contract. All other external resources remain atomic errors."
        - "Require T002's successful receipt to include separate sanitized original-source, materialized-source, resource-lock, stylesheet, font-asset aggregate, canonical, export, and compiler-receipt digests."
        - "Add to T005 that the baseline uses the same pinned offline resource lock, aborts every unexpected request, records zero live network requests, and compares against export containing the same embedded font bytes."
        - "Do not count the existing failed private receipt or its invalidated earlier determinism result toward any exit criterion."
      worker_package:
        task_id: T002-corrective-font-resource
        objective: "Complete the T002 foundation by implementing the narrow offline-pinned-font-materialization-v1 policy, re-running atomic private import and deterministic compilation, and producing a passed sanitized receipt without live network dependence or broader motion/resource support."
