      - "Schema-versioned canonical domain and validation"
      - "Fail-closed structural importer with complete inventories"
      - "Deterministic pure HTML/CSS compiler and receipt"
      - "Neutral public synthetic fixtures"
      - "Sanitized private import/compiler acceptance receipt"
      - "Three-run byte-identical HTML, CSS, export digest, and compiler-receipt evidence"
      - "Complete ordered slot, delay, step-timing, and element/property-track inventory evidence"
      - "Private-ignore and complete repository-safety proof"
    allowed_files:
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "packages/domain/**"
      - "packages/css-import/**"
      - "packages/css-compiler/**"
      - "fixtures/public-synthetic/**"
      - "scripts/check-private-ignore.mjs"
      - "scripts/check-sensitive.mjs"
      - ".private-corpus/**"
      - ".motion/**"
      - "artifacts/**"
    verify:
      - "npm run test:unit"
      - "npm run verify:determinism"
      - "npm run test:private-import"
      - "npm run check:private-ignore"
      - "npm run check:sensitive"
      - "npm run typecheck"
      - "git diff --check"
    stop_if:
      - "The private inventory disagrees with nine rules or eight applications and the discrepancy cannot be explained from sanitized technical inventory without widening scope."
      - "Any motion declaration, application field, slot ordering, animated property, or keyframe would need to remain in opaque presentation CSS."
      - "A target construct requires a general-purpose CSS escape hatch or implementation of deferred pseudo-element, responsive, trigger, composition, timeline, or range behavior."
      - "The private source, manifest, canonical output, or artifact cannot remain ignored and outside tracked content."
      - "A diagnostic or receipt would expose selector text, source excerpts, copy, branding, a local path, username, media, or other identifying private material."
      - "Implementation requires files outside allowed_files."
      - "The same verification failure remains unexplained after two attempts."
    receipt:
      result: blocked
      changed_files:
        - .private-corpus/manifest.json
        - .motion/private-canonical.json
        - .motion/receipts/t002-private.json
        - fixtures/public-synthetic/foundation.html
