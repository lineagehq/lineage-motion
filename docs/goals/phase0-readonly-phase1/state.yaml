version: 2

goal:
  title: "Phase 0 and Read-Only Phase 1"
  slug: "phase0-readonly-phase1"
  kind: existing_plan
  tranche: "Complete the approved Phase 0/read-only Phase 1 vertical slice and stop for architecture review."
  status: done
  oracle:
    signal: "Controlled Chromium proof and sanitized receipts demonstrate complete private import, deterministic pure HTML/CSS export, native-animation scrubbing, exact visual equivalence, interactive Chrome QA, and sensitive-content exclusion."
    cadence: "after each Worker package and at final audit"
    final_proof: "A final Judge maps fresh focused/full tests, type checking, build, controlled Chromium, interactive Chrome, receipt, and repository-safety evidence to every approved exit criterion and records full_outcome_complete: true."
  intake:
    original_request: "Complete Phase 0 and only read-only Phase 1 using GoalBuddy with rigorous criteria, Chrome QA, and an example animation."
    interpreted_outcome: "A verified read-only motion slice imports the private first scene, compiles and scrubs native CSS, proves exact visual equivalence, and remains authoring-capable without implementing Phase 2."
    input_shape: existing_plan
    audience: "Lineage Motion architecture owner"
    authority: approved
    proof_type: demo
    completion_proof: "All approved Phase 0/read-only Phase 1 exit gates pass with fresh sanitized receipts and the architecture-review stop is honored."
    likely_misfire: "Shipping a polished timeline or synthetic demo while missing import completeness, native scrubbing, deterministic proof, privacy checks, or phase boundaries."
    blind_spots_considered:
      - "Raw property keyframes and narrative shot cues are separate layers."
      - "Responsive landing variants must not broaden implementation scope."
      - "Controlled Chromium proof and interactive Chrome QA answer different risks."
      - "Private-corpus outputs must never enter tracked files."
    existing_plan_facts:
      - "The approved design is docs/superpowers/specs/2026-08-10-phase0-readonly-phase1-design.md."
      - "The private first target has nine keyframe rules and eight animation applications."
      - "The public 14-second landing animation is a read-only cue and authoring-readiness reference only."
      - "No Phase 2 mutation behavior is authorized."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase0-readonly-phase1/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase0-readonly-phase1"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved design, package boundaries, oracle, evidence thresholds, and task scopes before implementation starts."
    inputs:
      - "docs/incubation-plan.md"
      - "docs/architecture.md"
      - "docs/acceptance-corpus.md"
      - "docs/superpowers/specs/2026-08-10-phase0-readonly-phase1-design.md"
      - "This board's grounded acceptance criteria"
    constraints:
      - "Read-only."
      - "Preserve the Phase 0 and read-only Phase 1 boundary."
      - "Reject any task that implements the public landing animation or Phase 2 mutation behavior."
      - "Require direct evidence for every user-facing claim."
    expected_output:
      - "Validated or corrected package and file boundaries"
      - "Validated exact verification commands"
      - "Evidence-gap and likely-misfire assessment"
      - "Go/no-go decision for T002"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The approved design forms a bounded, reversible read-only vertical slice and T002 is a useful executable foundation rather than a helper-only package. Approval requires adding repository-safety files and explicit determinism verification to T002, treating deferred corpus constructs as fail-closed cases, and preventing T004 from recreating the public 14-second sequence. The three leading risks are count-only import evidence that misses tracks or slot order, opaque motion CSS that defeats future authoring, and private-data leakage through fixtures, diagnostics, paths, or receipts. Completion remains unsupported until native preview, controlled-Chromium equivalence, interactive Chrome QA, and final repository scans exist."
      worker_package:
        task_id: T002
        objective: "Implement and verify the schema-versioned motion domain, complete fail-closed structural CSS import, and deterministic pure HTML/CSS compiler as one executable vertical foundation, using neutral synthetic fixtures and the owner-supplied private first scene only through ignored local acceptance inputs."
        allowed_files:
          - .gitignore
          - package.json
          - package-lock.json
          - tsconfig.json
          - vitest.config.ts
          - "packages/domain/**"
          - "packages/css-import/**"
          - "packages/css-compiler/**"
          - "fixtures/public-synthetic/**"
          - scripts/check-private-ignore.mjs
          - scripts/check-sensitive.mjs
          - ".private-corpus/**"
          - ".motion/**"
          - "artifacts/**"
        verify:
          - "npm run test:unit"
          - "npm run verify:determinism"
          - "npm run test:private-import"
          - "npm run check:private-ignore"
          - "npm run check:sensitive"
          - "npm run typecheck"
          - "git diff --check"
        stop_if:
          - "The private inventory disagrees with nine rules or eight applications and the discrepancy cannot be explained from sanitized technical inventory without widening scope."
          - "Any motion declaration, application field, slot ordering, animated property, or keyframe would need to remain in opaque presentation CSS."
          - "A target construct requires a general-purpose CSS escape hatch or implementation of deferred pseudo-element, responsive, trigger, composition, timeline, or range behavior."
          - "The private source, manifest, canonical output, or artifact cannot remain ignored and outside tracked content."
          - "A diagnostic or receipt would expose selector text, source excerpts, copy, branding, a local path, username, media, or other identifying private material."
          - "Implementation requires files outside allowed_files."
          - "The same verification failure remains unexplained after two attempts."
        evidence_requirements:
          - "Record meaningful failing-test and passing-test receipts for schema validation, selector-independent stable identity, complete inventories, atomic failure, and deterministic compilation."
          - "The sanitized private receipt must report source, canonical, and export digests; importer/compiler versions; nine rules; eight applications; the complete ordered slot inventory including the simultaneous two-slot application; all staggered delays; both step-timed slots; every discovered element/property track; and supported, unsupported, and missing counts."
          - "Successful private import requires unsupported_count=0 and missing_count=0; any error diagnostic must return no canonical document."
          - "Three consecutive compilations from identical canonical bytes must produce byte-identical HTML, CSS, export digest, and sanitized compiler receipt."
          - "Synthetic tests must prove that changing a selector hint does not change canonical element identity and that all motion output is reconstructed from structured rules, applications, slots, tracks, and keyframes."
          - "Repository-safety proof must confirm .private-corpus, .motion, and private artifact targets are ignored and that no private or sensitive material appears in tracked files or the current complete diff."
      evidence:
        - "docs/incubation-plan.md authorizes only Phase 0 and read-only Phase 1 and expressly excludes persistence, claims, branching, mutation CLI, MCP, publication, and Lineage integration."
        - "docs/superpowers/specs/2026-08-10-phase0-readonly-phase1-design.md requires structural parsing, atomic fail-closed canonicalization, structured motion declarations, deterministic pure HTML/CSS, browser-owned scrubbing, and exact controlled-Chromium comparison."
        - "docs/architecture.md establishes selectors as binding hints, canonical IDs as identity, integer-millisecond timing, compiler-output preview, and no second interpolation engine."
        - "docs/acceptance-corpus.md permits private paths and generated private artifacts only in ignored local storage and permits tracked receipts containing sanitized digests, counts, identities, and aggregate metrics."
        - "The grounded criteria require exactly nine rules, eight applications, ordered slots, staggered delays, one simultaneous two-slot application, both step-timed slots, every property track, unsupported and missing inventories, and byte-stable canonical serialization."
        - "T002 is bounded to domain, CSS import, CSS compilation, synthetic fixtures, and local private acceptance; its constraints reject service, persistence, operations, CLI, adapters, and Phase 2 behavior."
        - "T003 provides a milestone gate before UI work, while T006 and T999 require fresh full proof and prevent planning or queued work from being mistaken for completion."
      parallel_safety:
        safe: false
        reason: "Only one Worker should run. T002 owns shared root configuration and package contracts later consumed by T004 and T005; concurrent work would not have provably disjoint allowed_files."
      missing_evidence:
        - "No implementation, red-green test receipt, private inventory receipt, or deterministic compiler receipt exists yet."
        - "No controlled-Chromium baseline stability, pixel-equivalence, native scrub, interactive Chrome, build, or final sensitive-content evidence exists yet."
        - "The private target's complete property-track count must be derived from its local inventory; nine rules and eight applications alone cannot prove completeness."
      required_board_updates:
        - "Replace T002's package with the approved worker_package in this receipt before dispatch."
        - "Clarify T004 that the public landing cue table is a schema-readiness reference only. Its synthetic fixture must use neutral, independently chosen cues and timing and must not encode or recreate the public 18-cue, 14-second sequence."
        - "Clarify T002 that pseudo-element applications, responsive overrides, restart/in-view triggers, animation composition, timelines, and ranges are deferred constructs: cover them with deterministic fail-closed tests, not production support."
        - "Add npm run qa:chrome to T005 verification so the final evidence package refreshes interactive Chrome proof separately from controlled Playwright Chromium proof."
        - "Define npm run check:sensitive to scan the complete tracked inventory, merge-base-to-HEAD branch diff, index, worktree, and untracked filenames/content while recording only sanitized aggregate results."
        - "Clarify T005 boundary sampling: derive every master-time discrete and steps boundary, sample each valid in-range t-1 ms and t+1 ms point, and record explicit endpoint handling when either side is outside the document duration."
      blocked_tasks: []
  - id: T002
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Implement and verify the schema-versioned motion domain, complete fail-closed structural CSS import, and deterministic pure HTML/CSS compiler as one executable vertical foundation, using neutral synthetic fixtures and the owner-supplied private first scene only through ignored local acceptance inputs."
    inputs:
