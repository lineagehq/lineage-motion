    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the bounded structural-authoring plan against current contracts and define exact keyframe, timing, easing, track-creation, identity, history, UI, and proof semantics before implementation."
    inputs:
      - "docs/incubation-plan.md"
      - "docs/architecture.md"
      - "docs/goals/phase2-authoring-slice/goal.md"
      - "docs/goals/phase2-authoring-slice/state.yaml"
      - "Current domain/compiler/editor/proof contracts"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the bounded Phase 2 slice and all non-goals."
      - "Select exactly one neutral target/property already supported by the current domain and compiler; reject importer or grammar expansion."
      - "Define exact operation envelopes, payloads, diagnostic precedence, ID allocation/validation, reference updates, and atomicity."
      - "Define insertion/removal ordering, collision, minimum keyframe, shared-rule, slot/application, duration/delay reprojection, and bounded easing behavior."
      - "Define the complete success/rejection/undo/redo state sequence and revision-neutral identity mappings."
      - "Require the UI and future adapters to share one reducer without building CLI, MCP, service, persistence, or adapter code."
      - "State the user-facing claim, top three realistic failure modes, and direct evidence required to defeat each."
    expected_output:
      - "Go/no-go decision"
      - "Exact chosen synthetic target/property and typed operation/identity contract"
      - "Exact timing/easing/history/rejection contract"
      - "Exact Worker allowed_files, verify, and stop_if"
      - "Exact controlled and installed Chrome evidence contract"
      - "Deferred scope and missing evidence"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Current contracts support one isolated opacity bundle on neutral cursor element el_a2849ff826f3e167 without importer, fixture, grammar, compiler-architecture, or phase expansion. Delay authority is binding.delayOverridesMs; the new single-binding slot delay must remain aligned. Deterministic selector-independent IDs and collision rejection are feasible. Full domain-to-Chrome proof remains required."
      target:
        element_id: el_a2849ff826f3e167
        property: opacity
        initial_duration_ms: 1000
        initial_delay_ms: 610
        initial_easing: linear
        endpoints: "0ppm=0; 1000000ppm=1"
      operations:
        - motion.track.create
        - motion.keyframe.add
        - motion.slot-duration.set
        - motion.binding-delay.set
        - motion.slot-easing.set
        - motion.keyframe.remove
        - motion.history.undo
        - motion.history.redo
      identity: "Derive rule/application/slot/rule-track/expanded-track/keyframe IDs from SHA-256 of documentId, elementId, property, owner IDs, and offset. Operations accept stable element/track/keyframe IDs but never selectors or caller-supplied structural creation IDs. Reject every collision; never suffix, merge, regenerate, or replace."
      timing: "Add midpoint at 1110ms/500000ppm; duration 1400ms projects 610/1310/2010; delay 700ms projects 700/1400/2100; easing is typed keyword linear or ease-in-out only. Offsets stay fixed. Reject fractional, overflowing, negative, out-of-document, clamped, sorted, merged, or coerced inputs."
      history_sequence: "S0 r0; create S1 r1; add S2 r2; duration S3 r3; delay S4 r4; easing S5 r5; remove S6 r6; stale rejection unchanged; U1..U6 r7..12 map S5..S0; R1..R6 r13..18 map S1..S6. Revision-neutral canonical/export/IDs/inventory/timeline/semantic/raster equality must be exact."
      atomicity: "Each success consumes one operation ID, increments revision once, records typed forward/inverse history, recompiles, and remounts exact compiler HTML. Rejections preserve every domain, history, selection/focus, compiler, iframe, animation, feedback, and redo observable."
      proof: "Three compiles per primary state; fresh independent controlled-Chromium contexts for S0..S6/U1..U6/R1..R6; exact t/t±1 boundary sampling; zero pixels outside cursor union plus 2px; exact equivalent-state pixels; installed Chrome accessible pointer/keyboard workflow; exact srcdoc; CSSAnimation ownership/currentTime; private/safety/type/build/diff gates."
      deferred: "All other targets/properties, public track deletion, importer/fixture expansion, generalized editing, persistence/service/CLI/MCP/collaboration/adapters/landing/video/publication/push/PR."

