version: 2

goal:
  title: "Phase 2 Track Creation and Timing Controls"
  slug: "phase2-track-creation-slice"
  kind: existing_plan
  tranche: "Complete one bounded keyframe/track creation and timing-control slice, then stop for owner review."
  status: done
  oracle:
    signal: "Chrome proves typed keyframe add/remove, duration/delay/easing edits, and one new property track with deterministic compiler-native preview and exact history restoration."
    cadence: "after the Worker package and at final audit"
    final_proof: "A final Judge maps fresh domain, compiler, Chrome, visual, privacy, build, and diff evidence to every criterion and records full_outcome_complete: true."
  intake:
    original_request: "Continue with the recommended next authoring slice."
    interpreted_outcome: "Extend the proven authoring loop to bounded structural track/keyframe creation and timing controls without later-phase scope."
    input_shape: existing_plan
    audience: "Lineage Motion architecture owner"
    authority: approved
    proof_type: demo
    completion_proof: "The complete creation/edit/removal/history loop passes automated and controlled Chrome proof with deterministic exports and clean safety gates."
    likely_misfire: "Build generalized timeline controls or UI-local mutations that bypass typed canonical operations, compiler output, or phase boundaries."
    blind_spots_considered:
      - "Creation requires deterministic stable-ID allocation and referential integrity."
      - "Deleting keyframes/tracks needs explicit minimum-count and dependency behavior."
      - "Duration/delay changes affect master-time projections and boundary sampling."
      - "Easing grammar must remain bounded and fail closed."
      - "Intentional visual changes require containment plus exact history restoration."
    existing_plan_facts:
      - "The reviewed Phase 2 value/time slice is integrated into local main at 60a4cad."
      - "The next slice adds/removes keyframes, edits duration/delay/easing, and creates one new property track."
      - "Typed operations, expected revisions, undo/redo, deterministic compiler output, and native preview remain mandatory."
      - "Persistence, services, CLI/MCP, collaboration, landing work, and Phase 3 remain deferred."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase2-track-creation-slice/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase2-track-creation-slice"

active_task: null

