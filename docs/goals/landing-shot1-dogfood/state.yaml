    assignee: Worker
    status: queued
    reasoning_hint: high
    objective: "Build the neutral trajectory foundation and atomic authoring slice: synthetic fixture, pure stable-identity projections, five strict operations, deterministic compilation, and exact undo/redo."
    allowed_files:
