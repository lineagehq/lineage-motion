        - "Set T002 active and keep T003 queued as the sole next Judge gate."
        - "Add .motion/receipts/landing-shot1-preflight.json to T002 allowed_files as an ignored generated artifact; keep the private manifest read-only."
        - "Replace T002’s blanket prohibition on counts with a prohibition on private, disaggregated, or identity-correlated counts; aggregate category counts are required by the approved receipt contract."
        - "Mark T004 through T008 blocked pending both a passing T002 receipt and T003 resolution of the incubation-phase authority conflict."
        - "Require T003 to return to architecture review rather than authorize mutations if the preflight fails or current phase authority remains unresolved."
