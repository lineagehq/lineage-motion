version: 2

goal:
  title: "Landing Shot 1 Dogfood"
  slug: "landing-shot1-dogfood"
  kind: existing_plan
  tranche: "Validate the approved plan, pass the private full-loop preflight, implement the bounded Shot 1 trajectory workflow, and stop after adversarial and owner QA."
  status: blocked
  oracle:
    signal: "Installed-Chrome owner walkthrough of the digest-locked private Shot 1 workflow backed by deterministic export, exact history, native preview, visual containment, and privacy receipts."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge maps complete import, trajectory editing, grouped edits, timing/hold, native preview, exact undo/redo, three-run export, boundary visual proof, and sensitive-content exclusion to the owner-facing claim."
  intake:
    original_request: "Return to the Bleep landing animation, separate it into shots, and dogfood editing the first shot's object placement, trajectories, grouping, speed, and easing."
    interpreted_outcome: "The owner can safely adjust the real landing animation's first 0–2,100 ms through a simple trajectory workspace without diverging from deterministic browser-native CSS or damaging Shot 2."
    input_shape: existing_plan
    audience: "Product owner creating and iterating CSS animations"
    authority: approved
    proof_type: demo
    completion_proof: "Owner completes the exact manual workflow in installed Chrome and receipts prove full-loop import, deterministic export, native preview, exact history, boundary containment, and zero private leakage."
    likely_misfire: "Build an attractive synthetic-only path editor while the private full loop still fails import or while UI mutations bypass the shared domain/service protocol."
    blind_spots_considered:
      - "Narrative shot cues are not inferred by the importer; ignored owner-approved workspace configuration must validate against canonical keyframes."
      - "Trajectory geometry and temporal easing are separate; spatial Bézier/freehand paths remain out of scope."
      - "Multi-object grouping is an ephemeral selection with one atomic delta, not a permanent hierarchy."
      - "Later-shot unsupported features cannot be silently dropped merely because the workspace focuses on Shot 1."
    existing_plan_facts:
      - "Approved design: docs/superpowers/specs/2026-08-18-landing-shot1-dogfood-design.md"
      - "Approved implementation plan: docs/superpowers/plans/2026-08-19-landing-shot1-dogfood.md"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/landing-shot1-dogfood/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/landing-shot1-dogfood"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved design and implementation plan against current repo boundaries, private-preflight authority, oracle strength, allowed files, verification, and stop conditions before any production write."
    inputs:
      - "docs/superpowers/specs/2026-08-18-landing-shot1-dogfood-design.md"
      - "docs/superpowers/plans/2026-08-19-landing-shot1-dogfood.md"
      - "docs/incubation-plan.md"
      - "AGENTS.md"
    constraints:
      - "Read-only; do not implement or inspect private source content."
      - "Preserve the hard preflight gate and fail-closed complete-loop requirement."
      - "Choose the largest safe next task; do not pre-authorize later packages if preflight evidence is missing."
    expected_output:
      - "complete | not_complete plan validation"
      - "Grounded preflight Worker contract with allowed_files, verify, and stop_if"
      - "Oracle and privacy audit"
      - "Deferred implementation packages"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The approved design and plan support exactly one safe next slice: the fail-closed private full-loop preflight. It fits the incubation plan’s import/export proof boundary and the repository’s privacy invariants. Later trajectory mutations, service/CLI work, and editor authoring are not yet authorized because the current incubation plan still names Phase 0 plus read-only Phase 1 as the immediate package. T002 must prove a complete canonical import, triple deterministic compile, closed transform capability, no live resources, and sanitized output before T003 reviews architecture and phase authority."
      evidence:
        - "The design’s Source and import boundary requires complete-loop inventory, no partial Shot 1 import, and no canonical document when unsupported behavior remains."
        - "The implementation plan’s Required order and stop gate makes Task 1 mandatory before any production-package modification and requires architecture review on failure."
        - "AGENTS.md requires fail-visible unsupported imports, stable identity independent of selectors, deterministic exports, compiler-rendered preview, private-corpus exclusion, and adversarial proof."
        - "docs/incubation-plan.md currently authorizes Phase 0 and only read-only Phase 1 as its immediate work package; its explicit boundary does not yet authorize trajectory mutations, persistence/claims, or CLI mutation."
        - next_worker_contract:
            objective: "Implement only the digest-locked private complete-loop preflight test and sanitized ignored receipt boundary. Read the owner manifest as immutable configuration, invoke existing import/compiler/resource boundaries, and make every unsupported or unsafe condition fail closed. Do not modify production packages or manually inspect/emit private source content."
