      - "Exact missing owner inputs, if any"
      - "Repository-grounded phase authority finding"
      - "Largest safe next Worker or Judge contract"
    receipt:
      result: done
      summary: "The prior ignored manifest proves a reusable schema and provisioning pattern, but it targets a different acceptance scene and cannot authorize the landing target. The landing manifest therefore requires owner-supplied semantic bindings; deterministic tooling may derive only actual digests, inventories, diagnostics, and receipt aggregates. Repository history proves later phases were merged after the incubation plan’s immediate-package text, making that paragraph stale. However, the merged Phase 4 work is architecture-only and explicitly excludes landing implementation. Safest recovery: owner provisions the ignored landing configuration, a bounded Worker reruns only the read-only preflight, then a Judge resolves explicit Phase 5 implementation authority before any mutation work."
      evidence:
        - claim: "Reusable provisioning precedent"
          proof: "A completed earlier worktree still contains an ignored, previously accepted manifest; repository receipts document byte-identical restoration into later worktrees without printing or tracking its contents."
        - claim: "Target-specific configuration is missing"
          proof: "A presence-only check confirms the dedicated landing manifest is absent while the earlier accepted manifest remains available."
        - claim: "Schemas differ semantically"
          proof: "Existing acceptance manifests contain only source and offline-resource locations; the approved landing plan additionally requires an expected source lock, owner-defined workspace semantics, stable target bindings, and expected aggregate inventory bindings."
        - claim: "Safe derivation boundary"
          proof: "Existing importer, materializer, compiler, and receipt tests derive actual digests, inventories, diagnostic codes, deterministic-export equality, and resource-closure evidence from owner-provided inputs."
        - claim: "Incubation text is historically stale"
          proof: "Git ancestry shows merged Phase 2, merged Phase 3 aggregate proof, and merged Phase 4 architecture review all postdate the unchanged incubation plan."
        - claim: "Landing mutation remains unauthorized by merged architecture"
          proof: "The merged Phase 4 decision is architecture-only, names implementation as future work, and explicitly excludes landing stress-test implementation."
        - claim: "Current landing documents preserve the gate"
          proof: "The landing design labels itself a bounded later-phase probe rather than implementation authorization; its plan requires a complete read-only preflight before any production modification and mandates architecture review on failure."
      facts:
        - fact: "Owner must supply or explicitly approve the dedicated ignored landing manifest; recovery must not repurpose the earlier scene manifest merely because its shape is reusable."
        - fact: "Owner-supplied semantic inputs are the source location, precommitted expected source lock, applicable offline-resource configuration, workspace/capture contract, stable target bindings, and expected aggregate inventory bindings."
        - fact: "Tooling may safely derive actual source and resource digests, importer inventories, capability categories, diagnostics, canonical/export digests, repeated-run equality, and sanitized aggregate receipt fields."
        - fact: "The earlier manifest can serve as a schema and local-only restoration precedent; its private values and target authority cannot be transferred."
        - fact: "Read-only landing preflight is the largest safe executable slice before the phase-authority decision."
      contradictions:
        - issue: "The incubation plan’s immediate-package paragraph still says early read-only work, while repository ancestry contains accepted later-phase work."
          impact: "That paragraph is stale as a status statement, but the ordered phase definitions and explicit later documents still constrain scope."
        - issue: "The landing implementation plan describes an approved implementation objective, while its governing design says it is not implementation authorization."
          impact: "The plan can authorize preparation and preflight, but repository evidence does not independently authorize production mutation past the gate."
        - issue: "Phase 4 architecture is complete, but Phase 4 implementation and exit are not proved; the landing probe belongs to the following phase."
          impact: "Production landing work would skip an explicit phase gate unless an owner records a bounded exception or completes Phase 4 first."
      ambiguity_requiring_judge:
        - question: "Does the accepted landing GoalBuddy goal constitute an explicit bounded exception allowing this later-phase probe before Phase 4 implementation exit, or is only its read-only preflight authorized?"
        - question: "Has the owner approved a target-specific landing manifest and confirmed whether an existing offline resource lock is applicable, without transferring authority from the earlier scene?"
        - question: "Should the incubation plan’s immediate-package paragraph be updated separately to reflect merged history while preserving ordered phase gates?"
      commands:
        - "git status --short; inspect the rendered T009 contract in the landing GoalBuddy board"
        - "Inspect T001–T003 receipts from docs/goals/landing-shot1-dogfood/state.yaml"
        - "Search repository documentation and tests for ignored-manifest and offline-resource contracts"
        - "Inspect repository history for phase-goal, architecture, and incubation-plan ancestry"
        - "Inspect branch containment for accepted Phase 2, Phase 3, and Phase 4 commits"
        - "Inspect the Phase 4 architecture-review board and architecture decision"
        - "Run presence-only checks for the prior accepted manifest and dedicated landing manifest without printing values"
