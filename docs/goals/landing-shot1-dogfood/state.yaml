              - "packages/css-import/src/landing-shot1.private.test.ts"
              - ".motion/receipts/landing-shot1-preflight.json"
            read_only_inputs:
              - ".private-corpus/landing-shot1-manifest.json"
            verify:
              - "npx vitest run packages/css-import/src/landing-shot1.private.test.ts --sequence.concurrent false"
              - "npm run check:private-ignore"
              - "npm run check:sensitive"
            stop_if:
              - "The source digest, ignored manifest, or required owner-supplied offline resource lock is unavailable or mismatched."
              - "The complete-loop import returns no canonical document or any importer error diagnostic."
              - "The 0, 700, and 2100 ms workspace boundaries require semantic inference rather than validation against ignored owner configuration and canonical keyframes/cues."
              - "The focal trajectories require unsupported transform composition, pseudo-elements, responsive variants, triggers, scripts, transitions, or generalized resource loading."
              - "Any source/import/compiler helper change or any file outside allowed_files is required."
              - "Any tracked output or command output would expose private source, identities, paths, selectors, copy, branding, screenshots, detailed geometry, URLs, or identity-correlated inventory."
              - "Triple compilation is not byte-identical or any external URL, import, local-font lookup, script, or live resource reference survives."
              - "Verification fails twice for the same unexplained reason."
            required_receipt_fields:
              - "tool and schema versions"
              - "source and canonical digests"
              - "aggregate actual/expected inventory equality"
              - "aggregate property and timing category counts"
              - "diagnostic codes"
              - "cue-presence booleans"
              - "closed transform capability categories"
              - "triple-export equality and digest"
              - "external-resource absence"
              - "pass status"
      subgoal_contract: null
      parallel_safety:
        safe: false
        reason: "Only T002 may write. No later Worker is safe in parallel because every implementation package depends on the private preflight and a subsequent phase/architecture gate."
      blocked_tasks:
        - T004
        - T005
        - T006
        - T007
        - T008
      missing_evidence:
        - "Passing digest-locked complete-loop private preflight receipt"
        - "Proof that required Shot 1 trajectories fit the approved closed transform grammar"
        - "Three-run deterministic compile/export evidence"
        - "Proof of zero surviving live resources"
        - "Current explicit phase authorization for mutation work beyond the incubation plan’s read-only Phase 1 boundary"
      required_board_updates:
