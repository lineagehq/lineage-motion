  - id: T009
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Map the smallest safe recovery for the missing ignored landing preflight configuration and the incubation-phase authority conflict using only repository history, sanitized receipts, ignored manifest schemas, and current architecture documents."
    inputs:
