version: 2

goal:
  title: "Phase 4 reusable cue breadth"
  slug: "phase4-reusable-cue-breadth"
  kind: existing_plan
  tranche: "Implement and prove reusable Type, Select, Drag, and Hold cues as one end-to-end Phase 4 Slice 2."
  status: done
  oracle:
    signal: "Named-subdomain installed-Chrome walkthrough authors all four cues from the unified canvas, persists/reloads them, reproduces them through CLI parity, and plays compiler-native CSS with clean boundary proof."
    cadence: "after each Worker package and at final audit"
    final_proof: "Judge maps durable editor/CLI parity, exact detach/undo, deterministic digests, native-animation Chrome traces, stable/discrete visual samples, reduced motion, responsive/keyboard QA, and privacy scans to all four cue families with full_outcome_complete: true."
  intake:
    original_request: "Proceed with the recommended next Phase 4 slice in a fresh worktree."
    interpreted_outcome: "Deliver simple canvas-first and agent-controllable Type, Select, Drag, and Hold cues through the existing durable compiler-native architecture."
    input_shape: existing_plan
    audience: "motion editor owner and agent collaborators"
    authority: approved
    proof_type: demo
    completion_proof: "One installed-Chrome durable walkthrough plus exact editor/CLI, history, determinism, visual-boundary, and privacy receipts proves all four cues without raw CSS editing."
    likely_misfire: "Ship schema, helpers, or another technical panel without a simple end-to-end authoring workflow, or accidentally broaden into later Phase 4/5 scope."
    blind_spots_considered:
      - "cue-owned tracks versus dual authority"
      - "plain-language semantics for Type and Select"
      - "drag geometry and intermediate arrivals"
      - "hold ripple ownership and timing"
      - "revision, claim, rejection, detach, undo, and reload integrity"
      - "native preview and discrete-boundary equivalence"
      - "reduced motion, responsiveness, keyboard order, console, and network health"
      - "private corpus and receipt leakage"
      - "premature five-scene, benchmark, or landing scope"
    existing_plan_facts:
      - "Phase 4 architecture orders reusable type-select-drag-hold immediately after the merged cursor-click-reveal slice."
      - "Cue-owned generated tracks are locked until explicit undoable detach-to-tracks."
      - "Editor and CLI use shared typed operations through the sole-writer service."
      - "Preview and scrubbing consume compiled CSS and browser-created animations."
      - "The merged canvas-first UX keeps technical controls under Advanced."
      - "Five-scene closure is Slice 3; review/handoff is Slice 4; aggregate benchmark is Slice 5; landing stress test is Phase 5."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase4-reusable-cue-breadth-2/"
    command: "node <goalbuddy-skill-root>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase4-reusable-cue-breadth"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved Phase 4 Slice 2 plan against current origin/main and define the largest safe exact implementation package without changing files."
    inputs:
      - "docs/incubation-plan.md"
      - "docs/architecture/phase4-coach-mark-breadth.md"
      - "merged PRs #9, #10, and #11"
      - "current package verification scripts"
      - "external private corpus availability, inspected only through sanitized facts"
    constraints:
      - "Read-only; do not edit product or board files."
      - "Confirm current merged behavior rather than trusting old receipts."
      - "Keep searches inside the repository and private inspection narrowly scoped."
      - "Do not expose private names, copy, selectors, paths, screenshots, or digest fragments."
      - "Reject schema-only, helper-only, alternate-runtime, or later-phase plans."
    expected_output:
      - "Current capability and gap matrix for Type, Select, Drag, and Hold"
      - "Explicit semantics and ambiguity decisions required before writing"
      - "Largest safe Worker objective with exact allowed_files, verify commands, and stop_if"
      - "Worktree base and ignored-private-input prerequisites"
      - "Named-subdomain Chrome and visual-proof scenarios"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The merged baseline already provides cue ownership, atomic lifecycle/history, shared editor/CLI dispatch, compiler-native preview, trajectory controls, and canvas-first disclosure. Type, Select, Drag, and reusable Hold are absent; the existing hold is fixture-locked. The architecture fully orders this as the next vertical slice. One end-to-end Worker package is the largest safe unit, provided it preserves existing cue bytes, introduces no alternate runtime, and uses synthetic fixtures until ignored private locks are available. Parallel writing is unsafe because all four cues intersect the same domain, protocol, service, CLI, and editor dispatch surfaces."
      evidence:
        - "Baseline: local origin/main resolves to df0075b4932455118a094993c6c9401b6a02fff0; merged PRs #9, #10, and #11 are present as fdea49a, 55ed967, and df0075b."
        - "Capability matrix — Type: no canonical semantic, protocol schema, CLI parser, editor workflow, generator bundle, or browser proof exists. Existing step-timed CSS support is reusable infrastructure only."
        - "Capability matrix — Select: no canonical semantic or workflow exists. Existing cursor/click primitives provide target identity and press feedback but do not model approach/choose/settle or optional highlight ownership."
        - "Capability matrix — Drag: stable trajectory/moment operations and canvas handles exist, but there is no cue-owned coordinated cursor-plus-dragged-target semantic, endpoint contract, CLI parity, or cue proof."
        - "Capability matrix — Hold: motion.hold.insert and motion.settled-hold.set are fixed to one synthetic cue/boundary and 600 ms. Generic cue replacement, detach, and exact inverse machinery exists, but reusable scoped hold expansion does not."
        - "Semantic decision: preserve motion.cursor-click-reveal generator version 1 and its existing derived IDs/bytes. Dispatch the four new kinds through a separately versioned generator; never reinterpret or migrate existing attached cues implicitly."
        - "Semantic decision: Type targets one existing text element and materializes width reveal from 0% to 100% with steps(stepCount,end), fill both, and no copy or DOM creation. Every step boundary is proof-addressable."
        - "Semantic decision: Select uses approach < choose < settle. The generator gives the existing cursor a deterministic press response; an optional existing highlight gains visibility/opacity at choose and remains selected. Without a highlight, the selected element receives a deterministic visual pulse. Constants belong to the generator version, not hidden document state."
        - "Semantic decision: Drag stores explicit stage-normalized dragged-object waypoints plus a fixed cursor grab offset. The cursor approaches the first grip point, cursor and object move together from move-start through arrive, and both retain the endpoint through release. Ordering is approach < press <= move-start < arrive < release."
        - "Semantic decision: Hold requires exitMs = enterMs + durationMs, an ordered stable target/track scope, and a digest-checked replacement bundle. Each affected track must have an explicit value boundary at enter or creation fails closed; expansion duplicates that boundary at exit and shifts later affected timing. Delete restores source; detach preserves generated bytes."
        - "Private availability: five HTML scene inputs are locally available. No adjacent stylesheet or font assets were observed, and this checkout has no ignored private-acceptance directory. Private proof therefore requires out-of-band digest-locked font/materialization inputs in the new worktree; public synthetic implementation may proceed without them."
        - "Worktree prerequisite: create the isolated branch from df0075b4932455118a094993c6c9401b6a02fff0, not the behind/dirty main checkout; transfer only this goal's control files and never private corpus bytes."
        - "Chrome proof: on a named localhost subdomain, author all four cues from the canvas, edit their principal moments/geometry, persist and reload, reproduce equivalent operations through CLI/service, and observe only compiler-created browser animations with zero console, page, request, or unexpected-network errors."
        - "Boundary proof: sample Type at every step boundary t-1/t/t+1; Select at choose and settle; Drag at press, move-start, arrive, and release; Hold at enter and exit. Repeat export/proof runs, verify equal digests, inspect reduced motion, and exercise keyboard order plus narrow/wide layouts."
        - "Adversarial failures to falsify: cue/track authority or detach/history drift; editor/CLI divergence or partial durable writes; preview/proof using a second runtime or leaking private material."
        - "Current verification entry points on origin/main include test:unit, test:phase3:service, test:phase3:recovery, test:phase3:parity, test:phase3:browser, test:browser, qa:chrome, test:visual, test:visual:authoring, test:visual:trajectory, verify:determinism, typecheck, build, check:sensitive, check:private-ignore, and git diff --check."
      subgoal_contract: null
      parallel_safety:
        safe: false
        reason: "All four cue kinds share the cue union, generator dispatch, validation, operation preparation, protocol schema, CLI parser, durable service path, and unified editor workflow; disjoint write ownership cannot be proven."
      blocked_tasks: []
      missing_evidence:
        - "No implementation or post-change verification exists yet; T003 must produce focused red/green tests and aggregate receipts."
        - "Installed-Chrome and visual-boundary evidence for the four new cue families does not yet exist."
        - "Ignored digest-locked private font/materialization inputs are absent from this checkout; private-corpus acceptance cannot run until supplied out of band."
      required_board_updates:
        - "Set T002 to create the worktree from exact base df0075b4932455118a094993c6c9401b6a02fff0 and record the missing ignored-private lock as an acceptance prerequisite, not an implementation blocker."
        - "Replace T003 allowed_files with: packages/domain/**; packages/motion-protocol/**; packages/local-service/**; packages/motion-cli/**; packages/css-compiler/**; packages/preview-runtime/**; packages/visual-proof/**; packages/phase3-proof/**; apps/editor/**; fixtures/public-synthetic/**; package.json. Do not allow privacy-checker scripts, package-lock.json, private inputs, or board state."
        - "Set T003 objective to implement the complete four-cue domain→protocol→sole-writer service→CLI/editor→compiler-native preview→Chrome/visual-proof slice while preserving existing cursor/click/reveal v1 bytes and IDs."
        - "Add T003 stop_if: any existing cue export/digest changes; Hold lacks an explicit enter boundary; compiler or preview must interpret cues; a production JS interpolator or runtime DOM is proposed; package-lock/private/privacy-checker files change; or later Phase 4/Phase 5 scope is required."
        - "Set T003 verify exactly to focused cue tests plus npm run test:unit; npm run test:phase3:service; npm run test:phase3:recovery; npm run test:phase3:parity; npm run test:phase3:browser; npm run test:browser; npm run qa:chrome on a named localhost subdomain; npm run test:visual; npm run test:visual:authoring; npm run test:visual:trajectory; npm run verify:determinism; npm run typecheck; npm run build; npm run check:sensitive; npm run check:private-ignore; git diff --check; and git diff --exit-code -- package-lock.json scripts/check-sensitive.mjs scripts/check-private-ignore.mjs."
