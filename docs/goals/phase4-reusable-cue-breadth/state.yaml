      full_outcome_complete: false
      rationale: "User-facing claim: a human can author Type, Select, Drag, and Hold simply on the unified canvas while an agent uses the same durable operations, with native deterministic CSS and safe history. The shared service/compiler spine exists, but the claim fails materially: reusable authoring is dropdown/form-driven rather than canvas-first; Drag coordinates do not account for element origins; Hold discards source playback semantics; reduced motion and boundary proof are incomplete; and the Chrome receipt is nondeterministic and path-bearing. One corrective vertical slice is required before final QA."
