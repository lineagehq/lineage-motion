          - packages/local-service/src/index.ts
          - packages/local-service/src/migrations.ts
          - packages/local-service/src/sqlite-project-store.ts
          - packages/local-service/src/test-support.ts
          - packages/local-service/src/service.test.ts
          - packages/local-service/src/branch-claim.test.ts
          - packages/local-service/src/recovery.test.ts
          - packages/local-service/src/branch-claim-recovery.test.ts
          - packages/motion-cli/src/cli.ts
          - packages/motion-cli/src/cli.test.ts
          - packages/phase3-proof/src/parity.test.ts
          - packages/phase3-proof/src/branch-claim-parity.test.ts
          - packages/phase3-proof/src/privacy.test.ts
        verify:
          - "npm run test:phase3:service"
          - "npm run test:phase3:recovery"
          - "npm run test:phase3:parity"
          - "npm run test:phase3:browser"
          - "npm run qa:chrome"
          - "repo_root=$(git rev-parse --show-toplevel) && npm exec vitest -- run --root \"$repo_root\" \"$repo_root/packages/domain/src/domain.test.ts\" \"$repo_root/packages/domain/src/authoring.test.ts\" \"$repo_root/packages/domain/src/repository-safety.test.ts\" \"$repo_root/packages/css-import/src/import.test.ts\" \"$repo_root/packages/css-import/src/materialize.test.ts\" \"$repo_root/packages/css-compiler/src/determinism.test.ts\" \"$repo_root/packages/preview-runtime/src/index.test.ts\" \"$repo_root/packages/visual-proof/src/index.test.ts\" \"$repo_root/packages/motion-protocol/src/index.test.ts\" \"$repo_root/packages/motion-cli/src/cli.test.ts\" \"$repo_root/packages/local-service/src/service.test.ts\" \"$repo_root/packages/local-service/src/branch-claim.test.ts\" \"$repo_root/packages/local-service/src/recovery.test.ts\" \"$repo_root/packages/local-service/src/branch-claim-recovery.test.ts\" \"$repo_root/packages/phase3-proof/src/parity.test.ts\" \"$repo_root/packages/phase3-proof/src/branch-claim-parity.test.ts\" \"$repo_root/packages/phase3-proof/src/privacy.test.ts\" --sequence.concurrent false"
          - "npm run verify:determinism"
          - "npm run test:browser"
          - "npm run typecheck"
          - "npm run build"
          - "npm run verify:phase3"
          - "npm run check:sensitive"
          - "npm run check:private-ignore"
          - "git diff --check"
          - "git diff --exit-code -- package-lock.json AGENTS.md docs/architecture/phase3-persistence-boundary.md docs/incubation-plan.md fixtures packages/css-import packages/css-compiler packages/preview-runtime packages/visual-proof scripts"
          - "git status --short"
        stop_if:
          - "Implementation requires any file outside allowed_files, a new npm dependency, package-lock change, or a SQLite import outside packages/local-service/src/sqlite-project-store.ts."
          - "Migration v1 would need to be edited or re-checksummed instead of adding a transactional, backed-up v2 migration that preserves the merged main head and canonical/export digests."
          - "A branch write cannot allocate exactly documents.last_revision+1 while comparing the addressed branch head and preserving pure canonical reduction."
          - "Authentication would rely on actor fields inside the command envelope, URL/query credentials, persisted browser storage, plaintext database secrets, or a generic account/session system."
          - "Acquisition retry cannot be bound privately to the same authenticated context and claim proof while keeping the public operation digest, response, receipt, event, and logs secret-free."
          - "A stale revision, stale lease version, overlap, wrong token/scope, revocation, retry conflict, or injected control fault can consume an operation ID or change any event, branch, claim, lease, document revision, or notification."
          - "The work requires claim listing, merge/review, annotations, broad collaboration, full per-control process-kill coverage, SSE replay, dirty-draft reconciliation, MCP, Lineage integration, publication, or Phase 4+."
          - "The editor or CLI would open SQLite, persist canonical documents or secrets, use a separate reducer/interpolator, address by CSS selector, or bypass the shared protocol client."
          - "Existing deterministic, compiler-native, reduced-motion, browser, privacy, or private-ignore proof must be weakened, skipped, or replaced."
          - "A focused verification command fails twice for the same unresolved product cause."
      missing_evidence:
        - "T002 must provide fresh focused, aggregate, Chrome, migration/restart, concurrency, idempotency, parity, determinism, privacy, and complete-diff evidence."
        - "T003 must independently audit the implemented contract without pulling Slice 3 forward."
