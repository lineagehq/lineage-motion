version: 2

goal:
  title: "Phase 3 minimum branches and claims"
  slug: phase3-branches-claims
  kind: existing_plan
  tranche: "Implement and prove only the approved Phase 3 Slice 2 minimum branch and claim vertical slice."
  status: done
  oracle:
    signal: "A synthetic editor/CLI walkthrough and exact tests prove branch creation/head reads plus atomic claim acquire, renew, release, revocation, authorization, and revision interaction through the sole-writer service."
    cadence: "after the Worker package and at final audit"
    final_proof: "Receipt-backed protocol, persistence, concurrency, recovery, parity, Chrome, determinism, and privacy evidence with full_outcome_complete: true for Slice 2."
  intake:
    original_request: "After merging PR #2, create a fresh worktree and prepare the bounded GoalBuddy board for Phase 3 Slice 2."
    interpreted_outcome: "A ready-to-run, rigorously bounded board for minimum branches and claims, without implementing it during prep."
    input_shape: existing_plan
    audience: "motion editor owner"
    authority: approved
    proof_type: test
    completion_proof: "Final Judge accepts exact automated and Chrome evidence for every approved Slice 2 branch/claim contract and no deferred behavior."
    likely_misfire: "Building a generalized collaboration/review system or stopping after schemas without a complete editor/CLI/service/SQLite path."
    blind_spots_considered:
      - "Claim-secret leakage in storage, logs, URLs, receipts, or browser state"
      - "Stale revision and lease-version races that partially mutate state"
      - "Branch/claim controls diverging between editor and CLI"
      - "Pulling merge, review, annotations, replay hardening, MCP, or Lineage integration forward"
    existing_plan_facts:
      - "PR #2 merged Phase 3 Slice 1 at merge commit c647d59791467479b5447305a5efe4ac5aeee593."
      - "The approved architecture orders Slice 2 as minimum branch creation/head reads and CLI-agent document or branch leases."
      - "Lease controls include acquire, renew, release, human revocation, client-retained secrets, verifier-only storage, idempotency, authorization failures, and atomic revision interaction."
      - "No merge or review behavior belongs in this slice."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase3-branches-claims/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase3-branches-claims"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the merged Slice 1 baseline and turn the approved Slice 2 architecture into one largest-safe vertical Worker contract."
    inputs:
      - "docs/architecture/phase3-persistence-boundary.md"
      - "docs/goals/phase3-branches-claims/goal.md"
      - "Merged Slice 1 protocol, store, service, CLI, editor, proof, and tests"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the sole-writer, shared-operation, expected-revision, stable-ID, deterministic export, compiler-preview, and reduced-motion invariants."
      - "Exclude merge, review, annotations, broad collaboration, replay hardening, MCP, Lineage integration, publication, and Phase 4+."
    expected_output:
      - "Grounded contract matrix for branch and claim operations, state transitions, stable errors, and secrets"
      - "Largest safe coherent Worker objective"
      - "Exact allowed_files, verify commands, stop_if conditions, and synthetic QA walkthrough"
      - "Top three realistic failure modes and adversarial proof requirements"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approved one coherent vertical Worker package. The healthy Slice 1 baseline is fixed-main only, so protocol, migration, store, service, CLI, editor, and proof must change together. Include only the migration/restart and lost-acquisition-response evidence needed to prove Slice 2 idempotency; defer the full per-control crash matrix, SSE replay, dirty-draft reconciliation, merge/review, and later phases."
      evidence:
        - "Merged baseline is origin/main at c647d59791467479b5447305a5efe4ac5aeee593; prior T999 explicitly leaves branches and claims outstanding."
        - "Fresh baseline verification passed: service 6/6, recovery 9/9, protocol/parity/privacy 4/4, and typecheck; the worktree remained unchanged."
        - "Architecture requires one loopback SQLite owner, document-global revisions, branch-head expected revisions, and atomic branch/claim control events."
        - "The approved protocol requires one strict client/union, stable errors, byte-identical committed retries, authenticated request context, and no ID consumption on rejection."
        - "Claims require client-retained high-entropy secrets, verifier-only storage, exact scope, lease-version CAS, human revocation, and one-winner overlap races."
        - "Slice 2 authorizes minimum branches/claims; Slice 3 explicitly owns the extended control crash matrix and refresh/replay hardening."
        - "Current protocol and migration hard-code main and contain no claim contract; ProjectStore and SQLite reads are fixed-main only."
        - "Current durable editor supports only track creation, making this one coupled protocol-to-preview package rather than safely parallel work."
      parallel_safety:
        one_worker_package_safe: true
        parallel_workers_safe: false
        reason: "Protocol unions, migration v2, global revision allocation, private idempotency, authorization, CLI, editor branch state, and proof share transaction semantics."
      worker_package:
        objective: "Implement and prove the complete Phase 3 Slice 2 minimum branches-and-claims path. Add strict branch creation and immutable branch-head reads; authenticated CLI-agent document or exact-branch claim acquire, renew, release, and claimed authoring; authenticated human branch creation, authoring, and claim revocation; client-retained high-entropy claim secrets with verifier-only SQLite storage; common idempotent control events; document-global revision allocation with branch-head compare-and-swap; and a minimal editor branch/revoke surface using the same versioned client as the CLI. Preserve exact compiler-backed native CSS preview, stable canonical IDs, deterministic exports/receipts, reduced-motion inspection, and the existing locked sole writer. Do not add claim listing, merge/review, annotations, broad collaboration, per-control crash matrices, SSE replay, dirty-draft reconciliation, MCP, Lineage integration, publication, or Phase 4+."
        allowed_files:
          - package.json
          - apps/editor/vite.config.ts
          - apps/editor/src/main.ts
          - apps/editor/src/global.d.ts
          - apps/editor/src/virtual.d.ts
          - apps/editor/src/styles.css
          - apps/editor/tests/phase3.spec.ts
          - apps/editor/scripts/serve-editor.mjs
          - apps/editor/scripts/qa-chrome.mjs
