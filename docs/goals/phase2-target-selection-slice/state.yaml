      - "docs/browser-qa-loop.md"
    constraints:
      - "Read-only product QA; do not patch implementation under this task."
      - "Use the visible in-app browser and a fresh application state."
      - "Exercise keyboard Orb selection, creation, authoring, native playback/scrubbing, invalid rejection, reduced motion, exact undo/redo, and a separate Cursor selection path."
      - "If material friction or failure appears, stop and create a bounded corrective Worker task."
    expected_output:
      - "Action/expected/observed owner-style walkthrough receipt"
      - "First-try usability assessment"
      - "Any smallest corrective package, or clearance for final Judge"
    allowed_files: []
    verify:
      - "Visible in-app-browser walkthrough at the local editor subdomain"
    stop_if:
