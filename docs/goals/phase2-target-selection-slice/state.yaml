        - "UI magic bypassing reducer/native preview: defeated by typed expected-revision operations, exact compiler iframe HTML, and browser-created CSSAnimation control."
        - "Nondeterministic identity/history, visual spill, leakage, or phase expansion: defeated by repeated IDs/exports, exact history digests/rasters, zero outside pixels/network, clean privacy scans, and complete diff inspection."
      missing_evidence: []
