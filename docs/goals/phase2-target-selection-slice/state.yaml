      - "full_outcome_complete: true | false"
      - "Claim-to-evidence matrix"
      - "Top-three failure-mode disposition"
      - "Owner-review stop or smallest corrective package"
    receipt:
      result: done
      task_id: T999
      decision: complete
      full_outcome_complete: true
      rationale: "The bounded target-selection workflow is proven end to end: exact Cursor/Orb opacity eligibility, revision-neutral selection, typed expected-revision creation, deterministic distinct bundles, one-track cap, compiler-native preview, complete authoring/history, controlled visual equivalence, private acceptance, safety, type, build, and protected-diff gates. Stop for owner review."
      user_facing_claim: "The editor can aim the bounded CSS-animation creation workflow at an explicitly eligible neutral element/property pair while preserving canonical safety, native playback, deterministic export, and exact history."
      evidence:
        - "Fresh focused domain/compiler/preview verification passed 65 tests; editor Playwright passed four workflows; installed Chrome 151 passed exact srcdoc, sandbox, CSSAnimation playback, selection, authoring, rejection, reduced-motion, and six-step undo/redo with zero application console errors."
        - "Distinct deterministic IDs were reproduced for Orb and Cursor; malformed, stale, shared, colliding, corrupt-history, and invalid-timing cases rejected atomically."
        - "Controlled visual proof reached nine consecutive passes, 21 contexts, 760 diagnostic samples, exact S/U/R digest equality, zero pixels changed outside the selected target, and zero live requests."
        - "Fresh complete verification passed 131 unit tests, 25 determinism tests, four browser tests, baseline visual proof, two private-acceptance tests, receipt verification, ignore/sensitive scans with zero findings, typecheck, build, and protected-diff checks."
      failure_modes:
