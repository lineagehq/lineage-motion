      remaining_blockers: []
      verification_attempts: 1

  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Run the visible owner-style in-app-browser QA walkthrough on a fresh local editor session and record whether target selection and the existing authoring workflow succeed without material friction."
    inputs:
