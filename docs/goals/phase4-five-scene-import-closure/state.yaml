version: 2

goal:
  title: "Phase 4 five-scene import closure"
  slug: "phase4-five-scene-import-closure"
  kind: existing_plan
  tranche: "Validate and close the five-scene import breadth with explicit deferrals, then stop before review/handoff and benchmark work."
  status: done
  oracle:
    signal: "A sanitized five-scene receipt proves every approved private alias was exercised end to end, every candidate stayed noncanonical, Scene C inertness was proved or rejected, both Scene E ledgers were retained, and all unavailable or unsupported inputs were explicitly deferred."
    cadence: "after each Worker package and at final audit"
    final_proof: "A Judge maps private and synthetic receipts, deterministic exports, browser-native preview traces, visual-boundary samples, and privacy scans to all five scene aliases with full_outcome_complete: true."
  intake:
    original_request: "Continue with the recommended Phase 4 Slice 3 five-scene import closure in a fresh GoalBuddy goal and worktree."
    interpreted_outcome: "Close import breadth across all five private scene aliases without silently guessing, canonicalizing candidates, or leaking private material."
    input_shape: existing_plan
    audience: "motion editor owner and agent collaborators"
    authority: approved
    proof_type: demo
    completion_proof: "Sanitized aggregate evidence demonstrates five-scene import inventory, explicit deferrals, noncanonical candidate behavior, deterministic output, browser-native preview, and privacy safety."
    likely_misfire: "Claim five-scene breadth from synthetic fixtures or metadata alone, fabricate missing corrections/fonts, silently promote candidates, or broaden into review/handoff, benchmarking, or Phase 5."
    blind_spots_considered:
      - "missing or stale private aliases"
      - "unavailable locked offline fonts or owner-supplied Scene B correction"
      - "false Scene C inertness caused by an incomplete capture"
      - "loss or conflation of Scene E supported and deferred ledgers"
      - "candidate data becoming canonical through service, compiler, preview, browser, or receipts"
      - "private copy, branding, selectors, filenames, paths, URLs, screenshots, or digest fragments leaking into tracked artifacts"
      - "synthetic-only proof masking installed-Chrome or discrete-boundary failures"
      - "scope creep into later Phase 4 slices or Phase 5"
    existing_plan_facts:
      - "Phase 4 architecture orders five-scene import closure after reusable cue breadth."
      - "Exercise all five approved private aliases end to end."
      - "Apply only digest-locked offline fonts and the owner-supplied Scene B correction; never fabricate either."
      - "Prove or reject Scene C inertness with observable evidence."
      - "Retain both Scene E ledgers."
      - "Import candidates remain noncanonical across service, compiler, preview, browser, and receipt boundaries until explicitly authored."
      - "Review/handoff is Slice 4, aggregate performance is Slice 5, and landing stress-test work is Phase 5."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase4-five-scene-import-closure/"
    command: "node <goalbuddy-skill-root>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase4-five-scene-import-closure"

active_task: null

