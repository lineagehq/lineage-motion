version: 2

goal:
  title: "Unified Canvas Production"
  slug: "unified-canvas-production"
  kind: existing_plan
  tranche: "Implement and owner-approve the complete unified-canvas Shot 1 workflow in production."
  status: done
  oracle:
    signal: "The real editor completes the approved no-Advanced unified-canvas workflow in Chrome using typed operations and compiler/native preview output."
    cadence: "after each production Worker package and at final audit"
    final_proof: "Fresh desktop+narrow Chrome walkthrough, complete repository oracle, and explicit owner approval of production behavior."
  intake:
    original_request: "Continue from the approved unified-canvas reference into production implementation."
    interpreted_outcome: "The real Shot 1 editor feels like the approved simple visual animation tool rather than separate complicated Pose and Path interfaces."
    input_shape: existing_plan
    audience: "Human visual authors dogfooding CSS animation creation"
    authority: approved
    proof_type: demo
    completion_proof: "In the production editor, the owner completes select, move, rotate, scale, waypoint edit, optional Move together translation, Play, Undo, and Redo without opening Advanced and approves the result."
    likely_misfire: "Copy the mockup visually while bypassing typed operations, compiler/native preview, exact history, spatial parity, or the current Shot 1 production behavior."
    blind_spots_considered:
      - "The approved reference lives beside an extensively dirty dogfood worktree and must not be used to justify overwriting or mixing unrelated work."
      - "Direct scale and rotation handles are new production affordances but must dispatch existing motion.transform-pose.set operations."
      - "Move together is translation-only; grouped scale and rotation remain unsupported."
      - "Responsive canvas geometry, pointer hit areas, keyboard semantics, playback hold, and settled no-drift behavior require production-native proof."
    existing_plan_facts:
      - "The approved interaction reference is docs/design-references/unified-canvas-ux/index.html with README.md and verify.mjs."
      - "Use one unified canvas with essential controls visible and Advanced collapsed."
      - "Map single-object move/scale/rotate to motion.transform-pose.set and waypoint/group translation to motion.transform-waypoints.translate."
      - "Preserve compiler output and browser-created CSSAnimation control; do not add a JavaScript interpolation engine."
      - "Work in a fresh bounded feature worktree and preserve the current dirty dogfood worktree."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/unified-canvas-production/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/unified-canvas-production"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the approved reference onto the exact current production editor, typed operations, tests, and dirty-worktree reality; identify a safe fresh-worktree formation and the largest credible implementation boundary."
    inputs:
      - "docs/design-references/unified-canvas-ux/index.html"
      - "docs/design-references/unified-canvas-ux/README.md"
      - "docs/goals/unified-canvas-ux/state.yaml"
      - "Current Shot 1 production editor and repository verification scripts"
    constraints:
      - "Read-only."
      - "Do not modify, stage, commit, stash, reset, or copy files."
      - "Do not inspect or expose private corpus content."
      - "Preserve the current dirty dogfood worktree and identify provenance for required production behavior."
      - "Distinguish existing typed operations from any genuine operation gap."
    expected_output:
      - "Reference-to-production interaction map"
      - "Exact source/test/runtime boundaries"
      - "Fresh worktree and branch formation options with risk evidence"
      - "Current verification baseline and oracle commands"
      - "Largest safe Worker candidate"
    receipt:
      result: done
      summary: "The approved UX maps to existing pose, waypoint-translation, timing, easing, hold, history, compiler, and native CSSAnimation boundaries. However, the complete Shot 1 production slice exists only in the heavily dirty dogfood worktree, not HEAD, origin/main, or main. Safest formation is a fresh worktree at 1b96d0e plus a Judge-approved path-explicit transfer of the validated Shot 1 cohort and approved reference/board, with source fingerprints preserved. The largest credible Worker is one cohesive unified-canvas editor package using existing typed operations; no new operation is presently required."
      evidence:
        - id: E1
          claim: "Approved interaction contract"
          detail: "The reference requires one stable 16:9 canvas; Path is an overlay, not a mode; Move together is translation-only; scale and rotation affect only the selected object; pointer edits preview continuously and commit once; Advanced does not alter canvas bounds; playback holds the exact Settled keyframe."
        - id: E2
          claim: "Existing operation mapping"
          detail: "Single-object move, uniform scale, and rotation map to motion.transform-pose.set. Waypoint movement and translation-only Move together map to motion.transform-waypoints.translate. Timing, easing, hold, Undo, and Redo map to motion.keyframe-group-time.set, motion.keyframe-group-easing.set, motion.settled-hold.set, motion.history.undo, and motion.history.redo. Selection, moments, Path visibility, grouping toggle, playback, and Advanced are UI-only."
        - id: E3
          claim: "Current editor gap"
          detail: "apps/editor/src/main.ts currently renders separate Pose/Path modes, always-visible exact pose/timing controls, target and moment fieldsets, and a trajectory overlay. It already supports object/moment selection, waypoint dragging, grouped translation, timing/easing/hold, and history, but lacks production direct uniform-scale and rotation handles and retains the split mental model rejected by the approved reference."
        - id: E4
          claim: "Native preview boundary"
          detail: "packages/preview-runtime/src/index.ts rejects animation sets that are not browser-created CSSAnimation/KeyframeEffect instances. Current phase3 browser tests assert exact currentTime, compiler-draft promotion, seeking, pause behavior, and no drift."
        - id: E5
          claim: "Revision provenance"
          detail: "The dirty branch is codex/landing-shot1-dogfood-design at 1b96d0eaa9a744f6557ef41712845341d143afaf, five commits above origin/main a1bb845420e504645b08d40b621e4c8e3a143f43. HEAD versions of editor main and domain index contain no Shot workspace/trajectory implementation. Main at ddfd5c7 and origin/main also predate this production slice."
        - id: E6
          claim: "Dirty fingerprint"
          detail: "Status has 116 entries: 65 untracked, 16 staged additions, 34 modified, and 1 staged-plus-unstaged file. Cached binary diff SHA-256: 6e7babd2f5641b08b1e346deb798873c6c0b2943f7132568a09ad72867fba471. Unstaged binary diff SHA-256: 67b901f098178cb5ed6ab9754f5b69b55c24494e06925c44b89dc7c178aebe6a. Porcelain-status SHA-256: c234d95e0a401ec004539a821eff80fb6106348c7f0d0ff27b702734459d45b2. Untracked-list SHA-256: a8da02b4e67c57284ef485eecbe689b0845e3210666b8747e56d286bf176ba78."
        - id: E7
          claim: "Production dependency breadth"
          detail: "Relative to HEAD, the tracked product delta alone is 4,310 insertions and 175 deletions across editor, domain, preview runtime, protocol, local service, manifests, and tests. main.ts differs by +1028/-35, phase3.spec.ts by +925/-2, domain index by +392/-67, and preview runtime by +350/-3. A clean checkout or three-file reference transfer cannot reproduce current behavior."
        - id: E8
          claim: "Prior sanitized proof"
          detail: "T084 records all five trajectory operation kinds, exact Undo/Redo restoration, preview/export equality, triple deterministic export, zero outside-changed pixels, zero live requests, and exact CSSAnimation time control. The completed dogfood audit records owner success. These receipts support the current dirty snapshot, not HEAD."
        - id: E9
          claim: "Safe formation"
          detail: "Preferred: create a new branch/worktree from exact base 1b96d0e, then transfer only a Judge-enumerated Shot 1 production cohort plus docs/design-references/unified-canvas-ux and docs/goals/unified-canvas-production. Do not touch the source worktree or index; require unchanged source fingerprints afterward. Reject basing on origin/main/main because required behavior is absent. Reject copying the entire dirty snapshot unless every path is classified, because it risks unrelated acquisition, private-test, evidence, and incubation changes."
        - id: E10
          claim: Boundaries
          detail: "UI: apps/editor/src/main.ts, styles.css, global.d.ts, virtual.d.ts. Runtime/build: editor vite config, serve-editor.mjs, qa-chrome.mjs, package manifests. Typed behavior: domain index plus trajectory/CSS-semantics/hash leaves; motion-protocol index. Native preview: preview-runtime index. Durable history: local-service sqlite store, seed, service/recovery tests. Compiler/import parity: touched css-compiler and css-import sources/tests. Browser oracle: apps/editor/tests/phase3.spec.ts. Visual/deterministic proof: visual-proof trajectory/authoring tests and sanitized receipts."
        - id: E11
          claim: "Largest Worker candidate"
          detail: "After fresh-baseline approval, one Worker can replace split Shot chrome with the full unified canvas: object/moment controls, Path overlay, body translation, screen-space uniform-scale and rotation handles, translation-only Move together, Play/Pause/Undo/Redo, collapsed Advanced, responsive desktop/narrow layout, keyboard/accessibility semantics, and focused tests. It must use existing typed operations and compiler/native preview. Domain/protocol/service/compiler files should remain read-only unless a specific verified gap appears."
        - id: E12
          claim: "Baseline and oracle"
          detail: "Before and after implementation run typecheck, build, test:phase3:browser, qa:chrome, test:unit, test:visual, test:visual:authoring, repeated test:visual:trajectory, verify:determinism, verify:receipts, check:private-ignore, check:sensitive, and git diff --check. Installed Chrome at 1440x900 and 768x900 must prove both objects, all three moments, move/scale/rotate/path/group translation, Play/Pause configured hold, exact Undo/Redo, CSSAnimation identity, endpoint hold/no drift, and zero console/network failure without opening Advanced."
      facts:
        - fact: "Stable identity is element/keyframe based; selectors remain bindings."
        - fact: "No new typed operation is required for the approved workflow."
        - fact: "Grouped scale/rotation, Bézier/freeform paths, multi-shot generalization, and JavaScript interpolation remain unsupported."
        - fact: "The source HEAD, index, tracked bytes, untracked inventory, and all four recorded fingerprints must remain unchanged during formation."
        - fact: "A clean baseline is not currently reproducible until T002 defines the transfer manifest."
