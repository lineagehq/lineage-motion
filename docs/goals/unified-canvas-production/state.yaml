      commands:
        - "Read production goal/state and approved reference README."
        - "Inspect mockup completion and prior dogfood receipts."
        - "Inspect branch, revisions, status, worktrees, staged paths, and dirty fingerprints."
        - "Search editor/domain/protocol/runtime/service operation and UI boundaries."
        - "Compare current production files with HEAD and inspect verification scripts."
