version: 2

goal:
  title: "Phase 4 revision-linked review and handoff"
  slug: "phase4-review-handoff"
  kind: existing_plan
  tranche: "Implement annotation lifecycle, immutable comparison, and sanitized deterministic handoff as one protocol-to-browser Slice 4 workflow, then stop before benchmarking and Phase 5."
  status: done
  oracle:
    signal: "Two immutable revisions can be reviewed, annotated, compared, and handed off through shared editor/CLI operations while canonical/compiler/export identity stays unchanged and private bodies never enter public evidence."
    cadence: "after each Worker package and at final audit"
    final_proof: "A Judge maps browser, CLI, sole-writer atomicity, restart, deterministic handoff, noninterference, and privacy receipts to the complete Slice 4 workflow with full_outcome_complete: true."
  intake:
    original_request: "Continue after merging the five-scene import-closure slice with the recommended fresh Phase 4 review-and-handoff goal and worktree."
    interpreted_outcome: "Deliver a simple end-to-end human/agent review workflow whose annotations and comparisons remain outside motion identity and whose handoff bytes are deterministic and sanitized."
    input_shape: existing_plan
    audience: "motion editor owner and human/agent collaborators"
    authority: approved
    proof_type: demo
    completion_proof: "A browser-visible five-action annotation lifecycle and immutable comparison, with CLI parity, produces repeated byte-identical sanitized handoff receipts without changing canonical/compiler/export output or leaking private bodies."
    likely_misfire: "Land schemas or project-management controls without a complete protocol-to-browser workflow, put annotations inside canonical motion, make comparison mutable, or expose payload-bearing handoff data."
    blind_spots_considered:
      - "annotation version races and document/branch revision drift"
      - "agent claim scope and authenticated authority"
      - "idempotent retry and process-restart behavior"
      - "immutable annotation snapshot allocation and identity completeness"
      - "private annotation bodies leaking through errors, logs, evidence, or UI test artifacts"
      - "comparison accidentally mutating, applying, accepting, or promoting a revision"
      - "handoff order dependence, omitted identity records, or inconsistent absent-category encoding"
      - "benchmark records invented before Slice 5"
      - "editor and CLI dispatch or receipt divergence"
    existing_plan_facts:
      - "The merged Phase 4 architecture orders revision-linked review and handoff after five-scene import closure."
      - "Annotations are service-owned and outside MotionDocument, canonical serialization, compilation, preview, export, and canonical revision allocation."
      - "Allowed annotation actions are exactly create, edit, resolve, reopen, and delete."
      - "Comparison is read-only between two immutable revisions and cannot merge, apply, mutate, accept, or promote."
      - "Handoff identity binds immutable document, annotation snapshot, comparison, proof, and explicit absent-category inputs."
      - "Slice 5 owns paired performance and aggregate proof; Phase 5 owns the landing stress test."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase4-review-handoff/"
    command: "node <goalbuddy-skill-root>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase4-review-handoff"

active_task: null

