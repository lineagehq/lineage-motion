        - failure: "Version, authorization, retry, concurrency, or transaction faults partially commit review state."
          required_proof: "Exercise successful human and claimed-agent writes plus stale branch revision, stale annotation version, missing/wrong/expired/scope-mismatched claim, duplicate operation conflict, concurrent compare-and-swap, and every fault point before/after commit. Prove exact retry equality, one stored review event after success, zero publication before commit, and unchanged annotation/snapshot/handoff state on rejection."
        - failure: "Comparison is mutable or handoff identity is incomplete/nondeterministic."
          required_proof: "Compare two exact immutable revisions and prove byte-identical store state before/after. Challenge omitted, duplicate, and reordered comparison/proof records and nonempty benchmark records. Repeat handoff with equal complete tuples across editor, CLI, idempotent retry, new operation ID, and process restart; require identical snapshot identity, handoff bytes, and digest."
      subgoal_contract: null
      parallel_safety: null
      blocked_tasks: []
      missing_evidence:
