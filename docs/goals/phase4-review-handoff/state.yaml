    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approve one coherent Worker. The review boundary is inseparable across protocol, SQLite atomicity, CLI/editor parity, browser reconciliation, deterministic handoff, and privacy proof. Splitting would create a schema/helper-only intermediate milestone and increase semantic drift. A distinct review protocol, receipt, persistence, and event stream avoids falsely allocating motion revisions. Revision anchors remain immutable while each mutation also compares the current branch head and annotation version. Snapshot allocation occurs only during handoff and reuses an identical ordered annotation-version set. Bodies cross only authenticated command requests, remain private at rest, and never appear in responses or evidence."
      evidence:
        - id: E1
          location: "docs/architecture/phase4-coach-mark-breadth.md:338-390"
          claim: "The merged contract fixes annotations outside MotionDocument and canonical revision allocation, exactly five actions, immutable comparison, complete handoff identity, explicit empty categories, snapshot-on-handoff, and allowlisted output."
