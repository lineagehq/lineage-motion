          - packages/local-service/src/review-handoff-recovery.test.ts
          - packages/motion-cli/src/cli.ts
          - packages/motion-cli/src/review-handoff.test.ts
          - packages/phase3-proof/src/review-handoff-parity.test.ts
          - packages/phase3-proof/src/review-handoff-privacy.test.ts
          - apps/editor/src/review-handoff.ts
          - apps/editor/src/main.ts
          - apps/editor/src/styles.css
          - apps/editor/src/global.d.ts
          - apps/editor/scripts/qa-chrome.mjs
          - apps/editor/tests/review-handoff.spec.ts
          - .motion/receipts/phase4-review-handoff-browser.json
          - .motion/receipts/phase4-review-handoff-installed-chrome.json
        verify:
          - "npx vitest run packages/review-domain/src/index.test.ts packages/motion-protocol/src/review.test.ts packages/local-service/src/review-handoff.test.ts packages/local-service/src/review-handoff-recovery.test.ts packages/motion-cli/src/review-handoff.test.ts packages/phase3-proof/src/review-handoff-parity.test.ts packages/phase3-proof/src/review-handoff-privacy.test.ts --sequence.concurrent false"
          - "npx playwright test apps/editor/tests/review-handoff.spec.ts --config apps/editor/playwright.config.ts --workers=1"
          - "node apps/editor/scripts/qa-chrome.mjs --phase4-review-handoff"
          - "npm run test:phase3:service"
          - "npm run test:phase3:recovery"
          - "npm run test:phase3:parity"
          - "npm run test:phase4:five-scene"
          - "npm run test:unit"
          - "npm run verify:determinism"
          - "npm run test:visual"
          - "npm run test:visual:authoring"
          - "npm run test:browser"
          - "npm run typecheck"
          - "npm run build"
          - "npm run check:sensitive"
          - "npm run check:private-ignore"
          - "git diff --check"
          - "git diff --exit-code -- package-lock.json AGENTS.md docs/architecture/phase4-coach-mark-breadth.md docs/incubation-plan.md fixtures packages/css-import/src packages/css-compiler/src packages/preview-runtime/src packages/visual-proof/src"
        stop_if:
          - "Any required tracked edit falls outside allowed_files or a new dependency/package-lock change is required."
          - "Implementation would extend MotionCommand or canonical commit events with a nonadvancing annotation pseudo-revision instead of using the distinct review envelope."
          - "Any annotation body or body-bearing payload would appear in a response, public projection, receipt, event, CLI output, browser inspection hook, log, screenshot, or tracked artifact."
          - "Any successful or rejected review action changes or allocates a MotionDocument revision, document last revision, branch head, canonical bytes, compiled HTML/CSS, preview bytes, export digest, or proof identity."
          - "Create/edit/resolve/reopen/delete cannot all enforce expectedBranchRevision and expectedAnnotationVersion atomically, or agent writes cannot enforce an active applicable claim."
          - "A failed, stale, unauthorized, conflicting, or fault-injected request consumes an operation ID, persists partial annotation/snapshot/handoff state, or publishes a review event."
          - "Comparison requires or exposes any mutate, merge, apply, accept, promote, redirect, or branch-head lookup in place of the two requested immutable revisions."
          - "Handoff cannot bind every required immutable input, enforce canonical record order, include explicit empty benchmarkRecords, reuse an identical snapshot, or reproduce byte-identical output across retries and restart."
          - "The installed-Chrome workflow cannot demonstrate all five actions, agent CLI parity, immutable comparison, handoff inspection, compiler-native preview invariance, and named lineage-motion.localhost execution."
          - "The same relevant verification fails twice without a grounded diagnosis."
          - "Work expands into Slice 5 benchmarking, Phase 5, generalized project management, MCP, Lineage integration, publication, release, deployment, push, or pull request."
      top_three_failure_modes:
