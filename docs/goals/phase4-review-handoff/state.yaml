        - boundary: editor
          existing: "Service-backed reconciliation, collaboration panel, diagnostics, browser test seam"
          gap: "Small five-action review UI plus immutable comparison and handoff inspection; dispatch the same protocol used by CLI."
        - boundary: verification
          existing: "Service/recovery/parity/browser/Chrome/determinism/privacy/build checks"
          gap: "Focused Slice 4 suites for five actions, human/claimed-agent parity, stale/version/conflict/fault rejection, restart/retry, snapshot immutability, comparison read-only behavior, handoff determinism/order/absence encoding, sentinel exclusion, and canonical/compiler/export invariance."
        - candidate_files: "packages/domain/src/index.ts,packages/motion-protocol/src/index.ts,packages/project-store/src/index.ts,packages/local-service/src/migrations.ts,packages/local-service/src/sqlite-project-store.ts,packages/local-service/src/index.ts,packages/motion-cli/src/cli.ts,apps/editor/src/main.ts,apps/editor/src/styles.css,apps/editor/vite.config.ts,packages/local-service/src/review-handoff.test.ts,packages/local-service/src/review-handoff-recovery.test.ts,packages/phase3-proof/src/review-handoff-parity.test.ts,packages/phase3-proof/src/review-handoff-privacy.test.ts,apps/editor/tests/review-handoff.spec.ts,package.json"
          focused_verification: "vitest run packages/local-service/src/review-handoff.test.ts packages/local-service/src/review-handoff-recovery.test.ts --sequence.concurrent false,vitest run packages/motion-protocol/src/index.test.ts packages/motion-cli/src/cli.test.ts packages/phase3-proof/src/review-handoff-parity.test.ts packages/phase3-proof/src/review-handoff-privacy.test.ts --sequence.concurrent false,playwright test apps/editor/tests/review-handoff.spec.ts --config apps/editor/playwright.config.ts --workers=1,npm run test:phase3:service,npm run test:phase3:recovery,npm run test:phase3:parity,npm run test:phase3:browser,npm run verify:determinism,npm run test:visual,npm run test:unit,npm run typecheck,npm run build,npm run check:sensitive,npm run check:private-ignore,git diff --check"
          dependencies: "Protocol/domain schemas must precede store/service/CLI/editor integration.,Migration and store atomicity must precede restart and browser proof.,Immutable annotation snapshot identity must precede handoff derivation.,Comparison and export/proof identity reads must precede complete handoff assembly.,Editor/CLI parity requires both use MotionServiceClient and identical canonical request/identity structures."
          risks: "Reusing canonical motion events/revisions for annotation changes would violate noninterference.,Returning private annotation bodies in generic errors, activity, snapshots, CLI stdout, browser hooks, or receipts would violate privacy.,A handoff digest based on unordered database results or omitted empty categories would be unstable or ambiguous.,Agent annotation authorization can accidentally check only capability and skip active claim scope/version.,Comparison UI could accidentally dispatch authoring operations or compare mutable branch heads instead of captured immutable revisions.,Adding all review operations to the existing motion union may force misleading resultingRevision/RevisionReceipt semantics."
      contradictions:
        - issue: "The architecture requires annotation writes to name an applicable document/branch revision but also forbids successful annotation writes from allocating a canonical motion revision; existing CommandSuccess and event types require resultingRevision and motion-operation kinds."
          impact: "Directly reusing MotionCommand/CommandSuccess/CommitMetadata is semantically ambiguous and may falsely imply canonical revision advancement."
        - issue: "The contract says annotation bodies must not enter service responses, logs, evidence, or UI test artifacts, while a human editor must create and edit bodies."
          impact: "A private-body-capable authenticated read/write channel is necessary for usable editing, but public/sanitized projections and browser evidence must be explicitly separated."
      ambiguity_requiring_judge:
        - question: "Should annotation writes use a distinct versioned review command/receipt/event envelope, or extend MotionCommand with a nonadvancing resultingRevision?"
          reason: "Current response and event schemas structurally model canonical revision commits."
        - question: "What exact applicable revision check is required for an annotation anchored to an immutable revision when the current branch later advances?"
          reason: "The contract mentions immutable document revision plus expected document/branch revision but does not define whether both anchorRevision and currentBranchRevision are mandatory."
        - question: "When is an immutable annotation snapshot allocated: explicit snapshot/handoff request, every successful annotation mutation, or both?"
          reason: "Architecture says allocation occurs when requested for handoff, while completion proof requires stable snapshot identity and restart determinism."
        - question: "Are annotation lifecycle events part of the existing commit-sequenced SSE/activity stream or a separate review stream?"
