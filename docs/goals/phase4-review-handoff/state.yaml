          location: "packages/motion-protocol/src/index.ts:219-304"
          claim: "Current CommandSuccess, RevisionReceipt, and CommitMetadata structurally imply a resulting motion revision and durable motion-operation kind; annotation writes therefore require a distinct versioned review envelope and event schema."
        - id: E3
          location: "packages/local-service/src/sqlite-project-store.ts:22-180"
          claim: "BEGIN IMMEDIATE, request replay/conflict checks, private payload storage, sanitized stored responses, expected-revision checks, and claim validation provide the reusable sole-writer transaction pattern."
        - id: E4
          location: "packages/local-service/src/migrations.ts:1-57"
          claim: "Persistence ends at migration v3 and has no annotation, review-event, immutable snapshot, or handoff tables, so an additive v4 migration is required."
        - id: E5
          location: "packages/local-service/src/index.ts:20-180"
          claim: "The service already authenticates reads and writes, delegates persistence to one store, and publishes only after commit; dedicated review routes can preserve those boundaries."
        - id: E6
          location: "packages/motion-protocol/src/index.ts:407-500; packages/motion-cli/src/cli.ts:20-242; apps/editor/src/main.ts:655-1011"
          claim: "MotionServiceClient is the existing shared typed editor/CLI boundary, and the editor already has durable serialization, immutable refetch, event reconciliation, and named-subdomain browser patterns."
        - id: E7
          location: "package.json; git HEAD 92bab191c437799a77c13306b4c41e5baed91ee7"
          claim: "The merged baseline exposes service, recovery, parity, browser, determinism, visual, typecheck, build, and privacy gates needed for regression verification."
      architecture_decisions:
        - "Use review.protocol.v1 with a separate strict ReviewCommand, ReviewResponse, ReviewReceipt, and sanitized ReviewEvent; do not extend MotionCommand, CommandSuccess, RevisionReceipt, or CommitMetadata with nonadvancing pseudo-revisions."
        - "Every annotation mutation names documentId, branchId, operationId, expectedBranchRevision, annotationId, and expectedAnnotationVersion. Create uses expectedAnnotationVersion 0 and an immutable anchorRevision; later actions preserve the anchor. The anchor must exist and be reachable from the named branch head."
        - "A branch may advance after annotation creation: a later mutation supplies the fresh current expectedBranchRevision while retaining the original anchorRevision. Stale branch heads or annotation versions reject atomically."
        - "Store review events in a separate review-sequenced table and publish them on a dedicated authenticated stream only after commit. Their sanitized metadata contains no body and does not masquerade as a canonical revision event."
        - "Bodies are accepted only in authenticated create/edit request payloads and private SQLite/event storage. No service response, list projection, receipt, event, CLI output, browser inspection hook, log, screenshot, or tracked artifact may contain a body or body-derived operation digest. Edit is explicit body replacement."
        - "Allocate an immutable annotation snapshot only as part of a handoff request. Canonicalize the exact annotation-ID/version set in stable order, digest the private snapshot, persist it immutably, and reuse the same snapshot version for the same document, branch, bound revision, and private digest."
        - "Comparison is an authenticated read of two stored immutable revisions. It may compile and project allowlisted stable IDs, timings, operation kinds, and full digests, but it performs no transaction, event, revision, head, annotation, snapshot, or handoff write."
        - "Handoff creation is a typed authenticated review request with idempotent stored sanitized response. It binds schema and serializer versions, document and branch IDs, immutable revision and canonical digest, snapshot version and digest, and strictly ordered comparison and proof identity records. Benchmark records are required to be an explicit empty list in Slice 4."
        - "Require at least one comparison identity and one proof identity in the end-to-end oracle. Reject duplicate or non-canonically ordered identity records rather than silently sorting ambiguous input."
        - "Human and claimed-agent annotation writes use the same review command and client. Agent writes require the existing active document-or-branch claim secret; comparison and handoff reads require authentication but no claim because they cannot alter review or motion state."
      worker_package:
        objective: "Implement the complete Slice 4 protocol-to-browser vertical slice using the approved distinct review.protocol.v1 boundary: service-owned branch-scoped annotations with create/edit/resolve/reopen/delete, immutable revision anchors plus current branch-head and annotation-version compare-and-swap, claimed-agent authorization, separate sanitized post-commit review events, snapshot-on-handoff, immutable read-only comparison, deterministic complete allowlisted handoff bytes, shared MotionServiceClient editor/CLI dispatch, and installed-Chrome proof that all review activity leaves canonical revisions, compiler output, preview, export, and private-body boundaries unchanged."
        allowed_files:
          - package.json
          - packages/review-domain/src/index.ts
          - packages/review-domain/src/index.test.ts
          - packages/motion-protocol/src/review.ts
          - packages/motion-protocol/src/review.test.ts
          - packages/motion-protocol/src/index.ts
