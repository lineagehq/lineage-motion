      worker_package:
        objective: "Revise the Phase 3 architecture document to close the branch/claim control-transaction, claim-credential recovery, persistence-wording, invariant-traceability, and acceptance-proof gaps identified by T004, without changing production code or expanding Phase 3 scope. 1. Define one common versioned command envelope for every persistent service mutation. Authoring, branch creation, claim acquisition, renewal, release, and human revocation must each carry a unique operationId, the applicable expected document or branch revision, and any additional leaseVersion precondition; 2. Extend committed idempotency to branch and claim control commands: identical normalized retries return the stored response; different requests with the same committed ID return OPERATION_ID_CONFLICT; rejected controls consume no ID and create no event; 3. State that every branch and claim control executes under the same BEGIN IMMEDIATE connection settings and atomically validates preconditions, writes its control event and state change, commits, and only then publishes. Stale, unauthorized, conflicting, or faulted controls must leave events, heads, claims, lease versions, and notifications unchanged; 4. Define overlapping claim exclusivity as a service query and insert/update performed inside the serialized transaction, with expiry evaluated once at a transaction-scoped instant. Do not rely on a simple uniqueness constraint to represent document-versus-branch overlap and expiry; 5. Replace the service-generated returned-once claim token design with a retry-safe contract: the client generates and retains a high-entropy claim secret, acquisition persists only its verifier/hash, and no raw secret appears in the database, event, digest-visible receipt, logs, or deterministic response. Subsequent authenticated requests may present the secret only through protected request context; 6. Clarify that canonical documents and private payloads may persist only in the protected store, while