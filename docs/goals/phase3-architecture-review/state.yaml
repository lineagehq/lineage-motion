version: 2

goal:
  title: "Phase 3 architecture review"
  slug: "phase3-architecture-review"
  kind: audit
  tranche: "Complete the read-only Phase 3 persistence architecture gate and produce an implementation-ready decision without adding persistence."
  status: done
  oracle:
    signal: "A final Judge decision demonstrates that the architecture contract covers every Phase 3 invariant, resolves the realistic failure modes, and keeps implementation out of this tranche."
    cadence: "after the architecture synthesis and at final audit"
    final_proof: "A receipt-backed architecture decision, verification matrix, and final adversarial audit with full_outcome_complete: true."
  intake:
    original_request: "Do the Phase 3 architecture review now."
    interpreted_outcome: "Resolve the sole-writer persistence boundary, revision model, storage contract, and editor/CLI parity before any Phase 3 implementation."
    input_shape: existing_plan
    audience: "The product owner and the next Phase 3 implementation run"
    authority: approved
    proof_type: decision
    completion_proof: "A durable architecture decision that maps the incubation plan and current invariants to explicit contracts, failure handling, and executable verification criteria."
    likely_misfire: "Producing a generic database plan, silently implementing persistence, or prebuilding collaboration features beyond the Phase 3 gate."
    blind_spots_considered:
      - "A second writer bypassing the local service"
      - "Stale revisions partially mutating state"
      - "UI and CLI dispatching behaviorally different operations"
      - "Schema migration, crash recovery, and deterministic receipt behavior"
      - "Private corpus or product content leaking into persistent fixtures or receipts"
    existing_plan_facts:
      - "A local service becomes the sole persistent writer once persistence exists."
      - "Every mutation names an expected revision and fails atomically when stale."
      - "Human editor and agent CLI dispatch the same typed domain operations."
      - "Minimum branch-head and document/branch claim contracts are authoritative Phase 3 architecture scope; this review does not implement them and does not pull forward richer review workflow, MCP, Lineage integration, publication, or later-phase behavior."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase3-architecture-review/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase3-architecture-review"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the authoritative Phase 3 requirements, current operation boundaries, persistence gaps, and verification surfaces without proposing implementation."
    inputs:
      - "docs/incubation-plan.md"
      - "AGENTS.md"
      - "package.json"
      - "Current domain, compiler, preview, editor, CLI, and evidence boundaries"
    constraints:
      - "Read-only."
      - "Do not edit implementation or architecture files."
      - "Do not inspect or copy private corpus content."
      - "Separate current facts from recommendations."
    expected_output:
      - "Evidence map with exact repository paths"
      - "Phase 3 requirement and invariant inventory"
      - "Current write-path and revision-gap map"
      - "Verification command inventory"
      - "Unresolved architecture decisions and top risks"
    receipt:
      result: done
      summary: "Phase 3 requires a standalone sole-writer local service, tool-specific SQLite persistence, shared typed UI/CLI operations, optimistic revisions, atomic events, branch heads, claims, structured CLI parity, and live refresh. Current code has a pure in-memory reducer with strict expected-revision checks, deterministic compilation, compiler-backed preview, and strong synthetic/browser proof surfaces. No service, SQLite store, CLI package, branch model, claim enforcement, durable event log, migration/recovery path, or cross-process refresh exists. Existing architecture documents describe intended boundaries but leave key persistence, transaction, concurrency, recovery, and protocol decisions unresolved."
      evidence:
        - path: docs/incubation-plan.md
          lines: "Phase 3 section"
          finding: "Authoritative deliverables are sole-writer local service, tool-specific SQLite store, operation envelopes, expected revisions, atomic events, branch heads, document/branch claims, structured CLI parity, and live editor refresh; exit requires equal UI/CLI canonical digests and rejection of stale or unauthorized writes without partial changes."
        - path: AGENTS.md
          lines: "Product invariants 1-10"
          finding: "Requires shared typed editor/CLI operations, sole persistent writer, atomic expected-revision rejection, claim-bounded agent writes, selector-independent identity, visible unsupported imports, deterministic exports/receipts, compiler-backed preview, native HTML/CSS output, and inspectable reduced motion."
        - path: docs/architecture.md
          lines: "Shape; Intended package boundaries; Import and export contract"
          finding: "Defines the intended editor/CLI-to-service topology and replaceable project-store boundary, explicitly labels it a boundary map rather than authorization, and requires preview to render compiler output."
        - path: docs/shared-ux-contract.md
          lines: "One state through Branch and review semantics"
          finding: "Describes intended single branch-head authority, one operation language, sole-writer service, optimistic revisions, claims, illustrative richer operation envelope, CLI flow, immutable branch heads, and explicit replay/cherry-pick semantics."
        - path: packages/domain/src/index.ts
          lines: "MotionDocument; OperationEnvelope; AuthoringState; dispatchAuthoringOperation"
          finding: "Current canonical document has documentId and numeric revision. Current envelope has schemaVersion, operationId, documentId, and expectedRevision only. The pure reducer rejects document mismatch, reused IDs, stale revisions, exhausted revisions, invalid candidates, and returns a new in-memory state."
        - path: apps/editor/src/main.ts
          lines: "module initialization and dispatch"
          finding: "Editor initializes AuthoringState from the build-time virtual motion document, constructs operation envelopes locally, calls dispatchAuthoringOperation directly, recompiles locally, and remounts preview. State, undo, redo, and consumed operation IDs are process-memory only."
        - path: packages/css-compiler/src/index.ts
          lines: "CompilerReceipt and compileMotionDocument"
          finding: "Compiler validates the document, rejects executable/live/opaque surfaces, derives document and export digests, and emits a deterministic receipt containing source, document, export, inventory, and provenance data."
        - path: packages/preview-runtime/src/index.ts
          lines: NativePreviewController
          finding: "Preview mounts compiled HTML in a sandboxed iframe and scrubs browser-created animations; it does not persist state or implement an independent interpolator."
        - path: package.json
          lines: "workspaces and scripts"
          finding: "No SQLite dependency, service command, CLI binary, migration command, or persistence test command is declared. Existing verification covers unit, browser, visual, deterministic compiler, private acceptance, receipts, sensitive-content, and type checks."
        - path: packages/domain/src/authoring.test.ts
          lines: "typed authoring operations tests"
          finding: "Tests directly prove in-memory stale rejection without mutation, operation-ID handling, deterministic structured edits, and exact undo/redo replay, but not transactional durability or multi-client concurrency."
        - path: packages/css-compiler/src/determinism.test.ts
          lines: "deterministic pure HTML/CSS compiler tests"
          finding: "Tests repeated byte-identical HTML, CSS, export digests, and serialized receipts, plus compiler fail-closed behavior."
        - path: apps/editor/tests/editor.spec.ts
          lines: "browser test inventory"
          finding: "Browser tests cover exact compiled preview, native animation controls, structured authoring, stale/atomic history behavior, and UX, but there is no UI-versus-CLI parity or external-write refresh test."
      facts:
        - "Current write path: editor event -> locally constructed AuthoringOperation -> in-process dispatchAuthoringOperation -> cloned AuthoringState with revision increment -> local compileMotionDocument -> iframe remount."
        - "Current reducer-level atomicity is functional: rejected operations return the prior state and accepted operations create a validated next state."
        - "There is no persistent writer, durable transaction boundary, SQLite schema, event table, branch-head record, claim record, migration mechanism, crash-recovery mechanism, or service protocol in the repository."
        - "There is no CLI package or executable, so editor/CLI parity cannot currently be exercised."
        - "The current operation envelope lacks projectId, branchId, actor identity, claim token, and a nested versioned operation payload described by the illustrative shared UX contract."
        - "Current revision checks protect one supplied in-memory state; they do not establish compare-and-swap behavior across processes or durable branch heads."
        - "Current undo/redo stacks and consumed operation IDs are ephemeral and disappear on reload."
        - "Selectors are already treated as hints while canonical element IDs and structural fingerprints provide identity."
        - "Verification command inventory: npm run test:unit; npm run verify:determinism; npm run test:browser; npm run test:visual; npm run verify:receipts; npm run check:private-ignore; npm run check:sensitive; npm run typecheck; npm run build; npm run qa:chrome."
        - "Phase 3 verification must add focused evidence for equal UI/CLI digests from one base, concurrent stale compare-and-swap rejection, unauthorized claim rejection, transaction rollback, branch-head advancement, restart/crash recovery, migration behavior, live editor refresh after CLI writes, deterministic/sanitized receipts, and private-data exclusion."
      contradictions:
        - "docs/shared-ux-contract.md presents a richer illustrative envelope and service-centric vocabulary, while the implemented envelope is intentionally narrower and editor-local; the document is directional, not evidence of current support."
        - "docs/incubation-plan.md names branches and claims as Phase 3 deliverables, while the current architecture-review tranche forbids implementation; this review can resolve contracts but cannot satisfy the Phase 3 implementation exit gate."
        - "The current reducer provides atomic state transitions in memory, but this must not be treated as proof of atomic persistent events or cross-process stale-write safety."
      ambiguity_requiring_judge:
        - "Define the exact SQLite ownership and process boundary, including whether compilation/export reads occur inside the service or against immutable returned revisions."
        - "Define the durable revision unit: document-wide versus branch-head revision, initial value, monotonicity, and compare-and-swap transaction semantics."
        - "Define operation/event idempotency across retries and restarts, including uniqueness scope and whether rejected IDs remain reusable."
        - "Define branch storage semantics: snapshots versus event replay, immutable revision addressing, head advancement, and initial replay/cherry-pick behavior."
        - "Define claim lifecycle and authorization semantics, including human override, expiry, heartbeat, and atomic interaction with expected revisions."
        - "Define transaction contents and rollback guarantees for document state, event receipt, branch head, operation ID, and claim validation."
        - "Define schema versioning, migration atomicity, backup/recovery, corruption handling, and crash points."
        - "Define the editor live-refresh transport and reconciliation behavior for dirty drafts, stale selections, undo/redo, reconnects, and missed events."
        - "Define the shared UI/CLI service protocol, structured success/error envelopes, conflict detail, exit codes, and canonical digest calculation point."
        - "Define what receipts may persist and expose so source content, private paths, credentials, URLs, SQLite files, and private screenshots cannot leak."
        - "Decide whether undo/redo remains client intent expressed as typed operations or becomes service-derived reversal over durable event history."
        - "Resolve which existing docs are normative versus illustrative so implementation cannot accidentally freeze outdated operation names or schema shapes."
      commands:
        - "git rev-parse --show-toplevel"
        - "sed -n '1,240p' docs/goals/phase3-architecture-review/state.yaml"
        - "sed -n '1,260p' docs/incubation-plan.md"
        - "sed -n '1,260p' AGENTS.md"
        - "sed -n '1,240p' package.json"
        - "rg --files . -g '!node_modules' -g '!dist' -g '!build' -g '!coverage'"
        - "rg -n \"export (type|interface|const|function|class)|revision|undo|redo|dispatch|compile|receipt|digest|sqlite|branch|claim|CLI\" packages apps README.md docs/architecture.md docs/shared-ux-contract.md"
        - "rg -n \"sqlite|better-sqlite|Database|server|listen|WebSocket|EventSource|localStorage|indexedDB|branch|claim|process\\.argv|bin\" . -g '!node_modules' -g '!dist' -g '!build' -g '!coverage' -g '!docs/goals/**' -g '!package-lock.json'"
        - "rg -n \"test\\(|describe\\(\" packages/domain/src/*.test.ts packages/css-compiler/src/*.test.ts packages/preview-runtime/src/*.test.ts packages/visual-proof/src/*.test.ts apps/editor/tests/*.spec.ts"
        - "git status --short"
        - "rg --files apps packages | rg '(^|/)(service|cli)(/|$)|sqlite|migration|branch|claim'"
      note_needed: false
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Select the smallest credible Phase 3 architecture and specify its contracts, rejected alternatives, and adversarial proof matrix."
    inputs:
      - "T001 receipt"
      - "docs/incubation-plan.md"
      - "Repository invariants"
    constraints:
      - "Do not implement."
      - "Keep the service local and the storage boundary replaceable."
      - "Resolve only the minimum branch-head and claim contracts explicitly required by Phase 3; do not implement them or pull forward richer review workflow, MCP, Lineage integration, or publication."
      - "Treat selectors as bindings rather than stable identity."
      - "Require deterministic documents, exports, and sanitized receipts."
    expected_output:
      - "Architecture decision and rejected alternatives"
      - "Sole-writer service and process-boundary contract"
      - "SQLite schema, transaction, revision, and migration contract"
      - "Typed operation envelope shared by editor and CLI"
      - "Live-refresh, crash-recovery, and stale-write behavior"
      - "Security and private-data exclusion boundary"
      - "Implementation slices with exact acceptance criteria"
      - "Top three realistic failure modes and proof matrix"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approve the architecture selection, not Phase 3 implementation or goal completion. The smallest credible design is one loopback-only service owning a replaceable transactional store, with SQLite immutable snapshots plus atomic events, global document revisions and branch-head CAS, a shared versioned editor/CLI protocol, minimum claim enforcement, and metadata-only live refresh. The authoritative Phase 3 plan explicitly requires branch heads and document/branch claims; the seed prohibition is reconciled as forbidding premature implementation and Phase 4 review workflow, not omitting required Phase 3 contracts. T003 may document this decision. T004 and T999 remain required."
      evidence:
        - kind: authority
          source: "docs/incubation-plan.md, Phase 3"
          finding: "Phase 3 explicitly requires the sole-writer local service, tool-specific SQLite store, envelopes, expected revisions, atomic events, branch heads, document/branch claims, structured CLI parity, and live editor refresh. Its exit gate requires equal UI/CLI canonical digests and atomic rejection of stale or unauthorized writes."
        - kind: invariants
          source: "AGENTS.md, Product invariants and data-safety rules"
          finding: "The design must preserve shared typed editor/CLI operations, one persistent writer, expected-revision atomicity, claim-bounded agent writes, selector-independent identity, deterministic exports and receipts, compiler-backed preview, standalone storage, and exclusion of private databases and corpus material from commits."
        - kind: scope_reconciliation
          decision: "The authoritative Phase 3 plan overrides the contradictory seed wording that says not to pull forward claims. This review resolves only the minimum Phase 3 branch-head and claim contracts and does not implement them. It excludes merge, cherry-pick, review comparison, annotations, handoff workflow, MCP, Lineage adapters, publication, video, CRDTs, and remote collaboration."
        - kind: process_boundary
          decision: "Run exactly one local service process for a store. It binds only to loopback, owns the OS advisory lock and every SQLite connection, and is the only component allowed to create, migrate, read, or write the database. The service hosts or same-origin proxies the editor API and SSE endpoint; the CLI uses the same generated protocol client. A second service for the same store fails before listening. Editor, CLI, compiler, and preview never open the database. SQLite files, WAL files, discovery data, and capability material live in service-owned user data outside the repository with restrictive permissions."
        - kind: replaceable_storage
          decision: "Define a ProjectStore interface containing immutable head/revision reads, atomic compare-and-commit, idempotency lookup, branch and claim control transactions, migration, health verification, and subscription replay. No SQLite type crosses this interface. Business validation and canonical reduction remain pure domain code; each adapter must provide the same atomicity, durability, idempotency, and ordering semantics."
        - kind: sqlite_schema
          decision: "Use a tool-specific database with: schema_migrations(version, checksum, applied_order); documents(document_id, last_revision); branches(document_id, branch_id, head_revision, base_revision); revisions(document_id, revision, parent_revision, canonical_json, canonical_digest, creating_event_id), keyed by document_id plus revision; events(commit_seq, event_id, document_id, branch_id, kind, operation_id, expected_revision, resulting_revision, request_digest, private_payload_json, sanitized_receipt_json), with operation IDs unique per document; and claims(claim_id, document_id, nullable branch_id, token_hash, holder_kind, lease_version, expires_at). Foreign keys and uniqueness constraints bind heads, revisions, events, and claims. Event payloads are local project data and never evidence receipts."
        - kind: revision_contract
          decision: "Canonical revisions are document-wide unsigned monotonic integers. An imported seed owns its initial immutable revision. Every accepted authoring operation allocates exactly last_revision + 1 inside the transaction; rollback allocates nothing. Each branch head points to one immutable document revision, and expectedRevision must equal that branch head. Branch creation names an existing source revision and expected source head, creates a new head pointer, and does not clone mutable state or allocate a canonical revision. No merge or review semantics are introduced."
        - kind: transaction_contract
          decision: "For authoring writes, SQLite uses BEGIN IMMEDIATE with foreign_keys=ON, journal_mode=WAL, and synchronous=FULL. Inside one transaction the adapter: checks committed idempotency; reads the branch head; compares expectedRevision; validates the authenticated claim context; runs the pure typed reducer; validates and canonically serializes the result; computes its digest; inserts the event and immutable revision; advances the branch head by CAS; updates the document revision counter; and commits. Any error rolls back all rows and emits no refresh notification. Notifications publish only after commit."
        - kind: typed_protocol
          decision: "Editor and CLI import one versioned schema and client. An authoring envelope contains protocolVersion, operationId, documentId, branchId, expectedRevision, and operation={schemaVersion,type,payload}. Payloads reference canonical element, track, cue, and keyframe IDs; CSS selectors are permitted only as import/source-binding metadata and cannot address mutations. The authenticated request context, not client-asserted envelope fields, establishes editor-human or CLI-agent capability and supplies any claim token. Branch and claim control commands are a separate discriminated union in the same versioned protocol."
        - kind: response_contract
          decision: "Success returns a canonical JSON response containing protocol version, operation ID, document/branch IDs, expected and resulting revisions, canonical digest, operation digest, and a sanitized deterministic revision receipt. Errors use stable codes VALIDATION, STALE_REVISION, UNAUTHORIZED_CLAIM, OPERATION_ID_CONFLICT, UNSUPPORTED_VERSION, and STORAGE_FAILURE. STALE_REVISION may expose current revision and digest but no document content. CLI prints the same JSON and maps success, validation, stale, unauthorized, conflict, and service failure to documented distinct exit codes."
        - kind: idempotency_and_stale_behavior
          decision: "A committed operationId retried with the identical normalized request digest returns the byte-identical stored success receipt even if the branch has advanced. The same committed ID with a different request returns OPERATION_ID_CONFLICT. Rejected requests create no event and do not consume the ID. A stale or unauthorized write performs no revision allocation, event insertion, head change, claim change, notification, or document mutation."
        - kind: minimum_claim_contract
          decision: "Every CLI-agent authoring write must present an active service-issued capability for either the exact branch or its document. Tokens are returned once, stored only by the client, and persisted only as hashes. Claims are exclusive across overlapping document and branch scopes, leased, explicitly renewable and releasable, and revocable by an authenticated human editor control action. Acquisition names the current document or branch revision; renewal/release uses claim ID plus leaseVersion CAS. Expired, revoked, wrong-scope, or wrong-token claims reject before reduction. Human editor writes still require expectedRevision but are not converted into agent claims."
        - kind: live_refresh
          decision: "The service publishes post-commit metadata through SSE using durable monotonically ordered commit_seq values. Events contain document ID, branch ID, revision, digest, and event kind, never canonical content or private payloads. On receipt, the editor fetches the immutable revision through the service and recompiles it with the existing compiler-backed preview. Reconnect supplies the last sequence for durable replay; if unavailable the service requires a full head refetch. Selection is reconciled by canonical IDs. Unsubmitted form drafts remain visibly stale and are never silently replayed; service-backed undo/redo dispatches ordinary typed inverse or replay operations with a fresh operation ID and current expected revision."
        - kind: crash_recovery_and_migration
          decision: "The service acquires its store lock, verifies SQLite integrity and referential consistency, and applies checksummed one-version-at-a-time migrations before accepting clients. Each migration is transactional and preceded by a SQLite-consistent backup outside the repository. Unsupported newer schemas, checksum mismatch, corruption, or migration failure fail closed without listening for writes; no client reconstructs or overwrites the store. WAL recovery yields either the complete committed transaction or the prior state. Restart validates every branch head's revision and digest before enabling mutation."
        - kind: receipt_and_private_data_boundary
          decision: "Canonical documents and private operation payloads may exist only as local project data in the protected store. Evidence and revision receipts use canonical key ordering and contain only schema/protocol versions, opaque IDs, revisions, inventory counts, operation/canonical/export digests, and stable error codes. They exclude raw copy, HTML/CSS, selectors, paths, URLs, credentials, capability or claim tokens, actor names, database locations, timestamps, screenshots, and event payloads. Operational lease responses may contain expiry data but are not deterministic artifact receipts. Equal immutable document revisions must compile to byte-identical exports and artifact receipts."
        - kind: rejected_alternatives
          alternatives:
            - "Reject editor- or CLI-owned SQLite connections, localStorage persistence, and shared database files because each creates a second writer."
            - "Reject separate editor and CLI reducers or wire formats because parity would be observational rather than contractual."
            - "Reject selector-addressed operations because ordinary source edits would change identity."
            - "Reject event-only replay because recovery would depend on replaying every historical reducer version; reject snapshot-only storage because it cannot prove idempotency or atomic events. Use immutable per-revision snapshots plus events."
            - "Reject filesystem watching or polling as the primary refresh mechanism because it lacks ordered post-commit semantics; use durable service events with refetch."
            - "Reject branch copies, mutable branch documents, CRDTs, merges, cherry-picks, and review workflows. Phase 3 needs immutable revision pointers and branch-head advancement only."
            - "Reject SQLite triggers containing domain behavior and receipt generation because they couple the replaceable store to the domain model."
            - "Reject putting timestamps, payload excerpts, paths, selectors, or tokens in deterministic receipts."
        - kind: implementation_slices
          slices:
            - order: 1
              name: "Durable vertical mutation"
              scope: "Versioned protocol, local service lock and loopback boundary, ProjectStore contract, SQLite schema/migrations, one existing authoring operation, atomic revision/event/head commit, idempotency, sanitized receipt, and restart tests."
            - order: 2
              name: "Editor and CLI parity"
              scope: "Generated shared client, structured CLI command/output/exit codes, editor dispatch through service only, immutable reads, compiler-backed preview, and equal-digest parity proof from identical fresh stores."
            - order: 3
              name: "Minimum branches and claims"
              scope: "Branch creation/head reads, CLI-agent document or branch leases, renewal/release/human revocation, authorization failures, and atomic interaction with head revisions. No merge or review behavior."
            - order: 4
              name: "Live refresh and recovery hardening"
              scope: "SSE replay/refetch, stable-ID reconciliation, visible dirty-draft conflicts, crash injection, integrity checks, migration failure behavior, private-data scanning, browser evidence, and the aggregate Phase 3 gate."
        - kind: acceptance_matrix
          proposed_commands:
            - command: "npm run test:phase3:service"
              must_prove: "Second-service lock rejection; no SQLite import outside the service/store boundary; one accepted CAS commit; concurrent same-base writes yield exactly one success and one STALE_REVISION; stale and invalid reducer requests leave all tables and the head byte-for-byte unchanged; exact idempotent retry; different-payload ID conflict; unauthorized, expired, revoked, and wrong-scope claim rejection; branch creation and branch-local head advancement."
            - command: "npm run test:phase3:recovery"
              must_prove: "Kill injection after begin, after event/revision insertion, before commit, and after commit-before-response; restart exposes either the complete pre-state or complete post-state only; committed retry returns the stored receipt; WAL recovery and head/digest checks pass; migration N to N+1 preserves canonical/export digests; injected migration failure leaves the old schema usable; unsupported newer schemas and corruption refuse writes."
            - command: "npm run test:phase3:parity"
              must_prove: "From two byte-identical synthetic fresh stores, the editor client and CLI client submit the same typed operation and produce equal canonical documents, canonical digests, compiled HTML/CSS bytes, export digests, and deterministic revision receipts. Schema rejection, stale details, and structured error codes also match."
            - command: "npm run test:phase3:browser"
              must_prove: "A CLI commit produces one post-commit SSE event; the open editor fetches the committed immutable revision and renders compiler output; selection survives by canonical ID; selector changes do not change identity; dirty drafts are marked stale and never auto-applied; disconnect/reconnect replays from commit_seq or performs an explicit head refetch."
            - command: "npm run verify:phase3"
              must_prove: "Runs service, recovery, parity, browser, existing unit/determinism/browser verification, typecheck, and build; repeats deterministic export and receipt serialization; scans receipts and logs for raw content, selectors, URLs, absolute paths, credentials, tokens, and database locations."
            - command: "npm run check:sensitive && npm run check:private-ignore && git diff --check && git status --short"
              must_prove: "No SQLite/WAL/backup/discovery files, private fixtures, corpus paths, screenshots, credentials, or payload-bearing receipts are tracked or present in the implementation diff."
        - kind: top_failure_modes
          failures:
            - rank: 1
              failure: "A hidden second writer or non-atomic compare-and-swap allows two same-base operations, a partial event, or a head without its revision."
              direct_proof: "Process-lock test, import-boundary inspection, two-client concurrency barrier, transaction fault injection, and before/after full-table snapshots must show one commit and one unchanged stale rejection."
            - rank: 2
              failure: "A crash, lost response, or migration interruption duplicates an operation or leaves event, revision, branch head, and receipt inconsistent."
              direct_proof: "Kill-point matrix plus restart, integrity/head-digest verification, identical committed retry receipt, transactional migration failure test, and unsupported-schema refusal."
            - rank: 3
              failure: "Editor/CLI protocol drift or refresh reconciliation produces a different canonical result, overwrites a dirty draft, addresses by selector, or exposes private payload data."
              direct_proof: "Independent-store UI/CLI byte-parity test, real-browser CLI-write refresh with dirty draft and stable-ID selection, schema rejection of selector-addressed mutations, deterministic receipt comparison, and sensitive-content scans."
      worker_package:
        task_id: T003
        objective: "Write the approved Phase 3 architecture decision as a durable repository document, including every selected contract, rejected alternative, implementation slice, acceptance command, and top failure mode above, without changing production code."
        allowed_files:
          - docs/architecture/phase3-persistence-boundary.md
        verify:
          - "npm run check:sensitive"
          - "git diff --check"
          - "git status --short"
        stop_if:
          - "Any material choice above cannot be documented without changing its semantics."
          - "Any implementation, package manifest, generated file, fixture, test, database, or state.yaml change would be required."
          - "The document would contain private content, absolute corpus paths, credentials, tokens, URLs, screenshots, or local database paths."
          - "The design expands into merge, review, MCP, Lineage integration, remote service, publication, video, CRDT, or other Phase 4+ scope."
          - "The document treats selectors as stable identity or permits any writer besides the local service."
      parallel_safety:
        safe: false
        rationale: "T003 is the only approved writer package. Parallel documentation or implementation work could overlap its sole allowed architecture file or prematurely encode an unaudited contract. Resume parallel work only after T004 approves the milestone and future packages have provably disjoint allowed files."
      missing_evidence:
        - "T003 has not yet written the durable architecture document."
        - "T004 has not checked the document for traceability, vague contracts, hidden writers, or Phase 4+ leakage."
        - "T999 has not performed the final architecture-gate audit."
        - "No Phase 3 implementation or executable Phase 3 test evidence exists; that absence is intentional for this read-only tranche and prevents claiming the implemented Phase 3 exit gate."
      required_board_updates:
        - "Store this receipt under T002 and mark T002 done."
        - "Correct the board's contradictory scope wording: claims and branch heads are authoritative Phase 3 architecture requirements, but this tranche authorizes documentation only and forbids implementation or richer Phase 4+ workflow."
        - "Promote the existing documentation-only T003 package unchanged in file ownership, with the approved architecture content requirements from this receipt."
        - "Keep T004 and T999 queued and keep goal.status active with full_outcome_complete false."
