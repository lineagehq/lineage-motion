          - "The exact eight rejected alternatives, four ordered slices, six command headings, or three failure modes would be removed or reordered."
      parallel_safety:
        safe: false
        rationale: "The corrective package owns the sole architecture decision file and changes cross-cutting protocol, storage, claims, recovery, and proof contracts. Parallel architecture or implementation work could encode the rejected ambiguity."
