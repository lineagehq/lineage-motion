version: 2

goal:
  title: "Phase 3 aggregate proof and exit gate"
  slug: phase3-aggregate-proof
  kind: existing_plan
  tranche: "Complete and independently judge only the approved Phase 3 Slice 4 aggregate proof."
  status: done
  oracle:
    signal: "Two clean runs from identical bases produce byte-identical canonical, compiled, export, and sanitized receipt evidence while every Phase 0-3 invariant, browser path, and privacy gate passes."
    cadence: "after the proof Worker package and at final audit"
    final_proof: "A fresh ten-invariant evidence matrix, repeated deterministic artifacts, installed-Chrome QA, privacy scans, and final Judge decision with full_outcome_complete: true."
  intake:
    original_request: "After merging Phase 3 Slice 3, create a fresh worktree and prepare the bounded GoalBuddy board for the aggregate Phase 3 proof and exit gate."
    interpreted_outcome: "A ready-to-run proof-only board that can make or reject the complete Phase 3 exit claim without starting Phase 4."
    input_shape: existing_plan
    audience: "motion editor owner"
    authority: approved
    proof_type: decision
    completion_proof: "Final Judge maps fresh reproducible evidence to all ten product invariants and accepts the complete Phase 3 exit gate."
    likely_misfire: "Adding product behavior or trusting earlier slice receipts instead of producing one fresh aggregate proof."
    blind_spots_considered:
      - "Aggregate scripts that omit required suites or reuse stale evidence"
      - "Editor/CLI or repeated-run byte drift hidden behind matching semantic assertions"
      - "Private paths, content, selectors, screenshots, credentials, or SQLite artifacts entering evidence"
      - "Browser tests that do not exercise installed Chrome or compiler-native preview"
    existing_plan_facts:
      - "Phase 3 Slices 1-3 are merged through f4e1368."
      - "The approved architecture defines Slice 4 as private-data scanning, deterministic receipt repetition, invariant non-regression, full browser and Chrome evidence, and the aggregate gate."
      - "Slice 4 proves the implementation and adds no Phase 4+ behavior."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase3-aggregate-proof/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase3-aggregate-proof"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit the merged Slice 3 baseline read-only, map every Phase 3 invariant to fresh direct evidence, and define the largest-safe proof-only Worker contract."
    inputs:
      - "docs/architecture/phase3-persistence-boundary.md"
      - "docs/incubation-plan.md"
      - "Merged Phase 0-3 implementation, tests, scripts, and sanitized receipts at f4e1368"
      - "Prior completed GoalBuddy boards as historical context only, never as fresh proof"
    constraints:
      - "Read-only; do not implement or rewrite receipts."
      - "Run enough fresh baseline checks to identify omissions, stale evidence, nondeterminism, or self-affirming proof."
      - "Map all ten repository invariants and every approved Phase 3 acceptance command."
      - "Prefer zero product-code changes and one coherent proof Worker package."
      - "Exclude Phase 4+, new authoring behavior, migrations, schema expansion, merge/review, annotations, MCP, Lineage, publication, video, private corpus expansion, and dependency changes."
    expected_output:
      - "Fresh baseline and evidence-gap map covering all ten invariants"
      - "Exact deterministic repetition and editor/CLI parity contract"
      - "Exact installed-Chrome, import, discrete visual, privacy, repository, and environment proof matrix"
      - "Largest-safe Worker objective with exact allowed_files, verify commands, and stop_if conditions"
      - "Top three realistic failure modes and direct falsification requirements"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The f4e1368 product baseline is strong but not exit-ready. Fresh approved Phase 3 commands pass, including installed Chrome 151, yet verify:phase3 omits unit, visual, private-acceptance, and aggregate-receipt gates. No fresh two-run aggregate receipt or complete invariant matrix exists; Chrome QA does not assert page errors, failed requests, or unexpected network traffic; and worktree-local visual proof currently fails on a hard-coded node_modules path. Approve one proof-only vertical slice that repairs those harness gaps, generates byte-stable sanitized evidence, and changes no product behavior."
      evidence:
        - claim: "Baseline identity and scope"
          proof: "Product implementation is unchanged from f4e1368; HEAD 5b9d419 adds only the aggregate GoalBuddy board. git status --short and git diff --check were clean."
        - claim: "Approved service command"
          proof: "Fresh npm run test:phase3:service passed 2 files and 14 tests, covering sole-writer lock, SQLite boundary, CAS concurrency, rejection atomicity, idempotency, branch/claim controls, and post-commit metadata."
        - claim: "Approved recovery command"
          proof: "Fresh npm run test:phase3:recovery passed 2 files and 34 tests, including authoring/control kill points, lost responses, migrations, integrity, unsupported schema, and claim-secret retry."
        - claim: "Approved parity command"
          proof: "Fresh npm run test:phase3:parity passed 5 files and 13 tests. It proves shared protocol behavior and equal-store CLI/editor parity, but not two complete clean aggregate repetitions."
        - claim: "Approved browser and Chrome commands"
          proof: "Fresh npm run test:phase3:browser passed 13 tests. Fresh npm run qa:chrome passed using installed Google Chrome 151.0.7922.138 and reran 13 browser tests; compiler-native output, native CSSAnimation, reconnect/refetch, dirty-draft conflict, branches/claims, and reduced-motion inspection passed."
        - claim: "Approved aggregate command"
          proof: "Fresh npm run verify:phase3 passed service 14, recovery 34, parity 13, browser 13, installed-Chrome QA, determinism 26, browser 20, typecheck, build, sensitive scan, private-ignore scan, and its current diff guard."
        - claim: "Invariant 1 — shared operation language"
          proof: "motion-protocol strict shared commands, CLI tests, parity.test.ts, branch-claim-parity.test.ts, and Phase 3 browser durable dispatch passed fresh."
        - claim: "Invariant 2 — sole persistent writer"
          proof: "service.test.ts passed second-lock rejection, node:sqlite import-boundary inspection, WAL/FULL/foreign-key configuration, and lock-holder death closure."
        - claim: "Invariant 3 — expected-revision atomicity"
          proof: "Fresh service/recovery suites passed same-base race, stale/invalid unchanged snapshots, injected faults, control CAS, and restart pre/post-state assertions."
        - claim: "Invariant 4 — claim-bounded agent writes"
          proof: "Fresh branch-claim and branch-claim-recovery suites passed capability, overlap, scope, expiry/revoke, lifecycle, concurrency, and verifier-only persistence cases."
        - claim: "Invariant 5 — selectors are bindings"
          proof: "Fresh protocol tests rejected selector addressing; import tests proved identity survives selector renaming; browser tests preserved selection by canonical IDs across branch availability."
        - claim: "Invariant 6 — unsupported imports fail visibly"
          proof: "During the supplemental unit run, all 42 css-import tests passed, including atomic unsupported binding, script/external-resource, and orphan-override rejection. The overall unit command later failed in an unrelated visual attestation test."
        - claim: "Invariant 7 — byte-identical equal revisions"
          proof: "Fresh compiler determinism passed 26 tests, including three-run HTML/CSS/digest/receipt identity, and parity passed equal-store comparisons. Missing: one two-run aggregate editor/CLI artifact and receipt comparison."
        - claim: "Invariant 8 — compiler-backed preview"
          proof: "Fresh browser and installed-Chrome checks asserted iframe srcdoc equals compiledHtml, immutable refetch occurs after SSE, and native CSSAnimation instances drive playback."
        - claim: "Invariant 9 — browser-native HTML/CSS output"
          proof: "Fresh compiler determinism, browser, and Chrome checks passed native HTML/CSS output with no alternate interpolator."
        - claim: "Invariant 10 — intentional reduced motion"
          proof: "Fresh installed-Chrome QA reported reducedMotionInspectable=true; existing browser/compiler verification passed. It must be named explicitly in the aggregate matrix."
        - claim: "Visual and privacy supplemental checks"
          proof: "npm run test:visual passed its controlled three-replay, discrete-boundary proof. check:sensitive passed with findingCount 0 across 169 tracked files and zero untracked files; check:private-ignore passed 3/3 ignored and zero tracked private targets."
        - claim: "Fresh harness defects"
          proof: "npm run test:unit produced 197 passes and one failure because authoring.visual.test.ts assumes worktree-local node_modules/playwright-core/browsers.json. npm run verify:receipts failed because the ignored fresh private receipt was absent. Current qa:chrome captures console errors but not pageerror, requestfailed, or unexpected-network evidence."
        - claim: "Top failure mode 1 falsification"
          proof: "Require verify:phase3 to invoke every approved command plus unit, all visual suites, private acceptance, receipt verification, typecheck/build, scans, and a ten-invariant aggregate receipt; T003 must inspect the command expansion and fresh logs."
        - claim: "Top failure mode 2 falsification"
          proof: "Run two clean equal-base editor/CLI proof repetitions and compare canonical bytes/digests, compiled HTML and CSS bytes, export digests, sanitized revision/control receipts, and the complete aggregate receipt byte-for-byte."
        - claim: "Top failure mode 3 falsification"
          proof: "Require installed-Chrome pageerror/requestfailed/network allowlist assertions, banned-field/value receipt assertions, sensitive/private-ignore scans, tracked-artifact inventory, complete f4e1368 diff inspection, and zero SQLite/WAL/screenshots/private payloads."
      parallel_safety:
        safe: false
        reason: "Use one Worker. The package touches shared package command wiring and a single aggregate evidence contract; splitting it would make command coverage and receipt provenance ambiguous."
      blocked_tasks: []
      missing_evidence:
        - "No fresh byte-identical two-run aggregate receipt from identical clean bases."
        - "verify:phase3 currently omits test:unit, test:visual, Phase 2 visual suites, test:private-acceptance, and verify:receipts."
        - "Installed-Chrome QA does not directly assert uncaught page errors, failed requests, or an explicit unexpected-network allowlist."
        - "Worktree execution of authoring.visual.test.ts fails because Playwright metadata is resolved through a nonexistent worktree-local node_modules path."
        - "The ignored private acceptance manifest/receipt was unavailable in this worktree, so fresh private import and private visual evidence were not produced."
        - "No single sanitized artifact maps all ten invariants, exact commands, counts, environment, stable digests, Chrome result, and repository/privacy gates."
      required_board_updates:
        - "Copy the approved proof-only Worker package onto T002 and activate it as the sole Worker."
  - id: T002
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Produce one fresh proof-only Phase 3 aggregate vertical: make the complete gate reproducible in a linked worktree, run two identical-base editor/CLI proof repetitions, strengthen installed-Chrome diagnostics, execute every Phase 0-3 acceptance suite including discrete visual/private gates, and emit one byte-stable sanitized ten-invariant receipt without changing product behavior."
    allowed_files:
      - package.json
      - apps/editor/scripts/qa-chrome.mjs
      - packages/phase3-proof/src/aggregate.test.ts
      - packages/visual-proof/src/authoring.visual.test.ts
      - packages/visual-proof/src/private.private.test.ts
      - packages/visual-proof/src/receipt.private.test.ts
      - docs/evidence/t002-phase3-aggregate.json
    verify:
      - npm run test:phase3:service
      - npm run test:phase3:recovery
      - npm run test:phase3:parity
      - npm run test:phase3:browser
      - npm run qa:chrome
      - npm run test:unit
      - npm run verify:determinism
      - npm run test:visual
      - npm run test:visual:authoring
      - npm run test:private-acceptance
      - npm run verify:receipts
      - npm run typecheck
      - npm run build
      - npm run check:sensitive && npm run check:private-ignore && git diff --check && git status --short
      - >-
        proof_tmp=$(mktemp -d) && npm run verify:phase3 && shasum -a 256
        docs/evidence/t002-phase3-aggregate.json | awk '{print $1}' > "$proof_tmp/run1.sha" && npm run
        verify:phase3 && shasum -a 256 docs/evidence/t002-phase3-aggregate.json | awk '{print $1}' >
        "$proof_tmp/run2.sha" && cmp "$proof_tmp/run1.sha" "$proof_tmp/run2.sha"
      - git diff --exit-code f4e1368 -- package-lock.json AGENTS.md docs/architecture/phase3-persistence-boundary.md docs/incubation-plan.md fixtures apps/editor/src packages/css-import/src packages/css-compiler/src packages/domain/src packages/local-service/src packages/motion-cli/src packages/motion-protocol/src packages/preview-runtime/src packages/project-store/src
      - git diff --name-only f4e1368
    stop_if:
      - "Any correction requires product implementation, protocol/domain/storage semantics, migration history, dependencies, package-lock, or Phase 4+ behavior."
      - "A proof failure repeats twice for the same product cause; return the exact failure and pre/post evidence for Judge re-contracting."
      - "The aggregate receipt cannot exclude raw copy, HTML/CSS, selectors, URLs, absolute paths, credentials, capabilities, tokens, database locations, timestamps, screenshots, event payloads, and nondeterministic operation IDs/timing samples."
      - "Installed Google Chrome cannot be launched or Chrome evidence shows a console error, uncaught exception, failed request, or non-allowlisted network activity."
      - "Private acceptance would require tracking or copying private source, branding, paths, screenshots, SQLite/WAL/backup/discovery files, or payload-bearing receipts."
      - "Any file outside allowed_files changes, including board state; stop and report the exact path."
      - "Do not weaken, skip, or conditionally pass a required acceptance assertion because private inputs or browser metadata are missing; report unavailable evidence explicitly."
    receipt:
      result: blocked
      changed_files: []
      commands:
        - "git rev-parse --show-toplevel"
        - "rg --files \"$repo_root\" -g 'AGENTS.md' -g 'AGENTS.override.md'"
        - "git status --short"
        - "git diff --name-only f4e1368"
        - "git rev-parse --git-common-dir"
        - "test -f .private-corpus/manifest.json"
        - "test -f \"$primary_root/.private-corpus/manifest.json\""
        - "test -f node_modules/playwright-core/browsers.json"
      summary: "Stopped before editing because required private acceptance evidence is unavailable: neither the linked worktree nor its primary repository has .private-corpus/manifest.json. T002 explicitly forbids skipping or conditionally passing private assertions and requires unavailable evidence to be reported. The linked worktree also lacks local Playwright metadata, but that authorized harness correction was not attempted because the missing private input is already a stop condition. Existing PM-owned board changes were preserved."
      remaining_blockers:
        - "Provide the ignored external private acceptance manifest and referenced resources without tracking or copying them into the repository, then rerun T002."
      verification_attempts: 0
      stopped_because: "Required private acceptance evidence is missing, triggering T002 stop_if: do not weaken, skip, or conditionally pass a required assertion because private inputs are missing."
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Adversarially review the Worker diff and evidence, reject stale or incomplete proof, and identify any exact remaining Phase 3 gap."
    inputs:
      - "T001 grounded contract"
      - "T005 replacement Worker complete diff and receipts; T002 remains historical blocked evidence"
      - "Fresh aggregate command outputs and installed-Chrome evidence"
    constraints:
      - "Read-only; do not repair the work."
      - "Independently inspect the complete diff and evidence provenance."
      - "Do not accept semantic similarity where byte identity is required."
      - "Do not pull Phase 4 or new product behavior into a proof tranche."
    expected_output:
      - "Decision with supported gaps or approval"
      - "Exact evidence for all ten invariants and three failure modes"
      - "Scope and sensitive-content inspection"
      - "Required board updates and next contract if incomplete"
    receipt:
      result: done
      decision: not_complete
      full_outcome_complete: false
      rationale: "The proof package otherwise supports all ten invariants: both aggregate runs passed, the sanitized receipt was byte-identical, installed Chrome and private/visual gates passed, protected product paths are unchanged, and current privacy scans are clean. Completion is still invalid because test:unit discovered authoring.visual.test.ts and changed a tracked historical receipt outside T005 scope. The exact diff is consecutiveFocusedPasses 4 to 5. One bounded Worker must restore the f4e1368 bytes, exclude all *.visual.test.ts files from unit discovery, and repeat both complete gates while proving the historical receipt remains unchanged."
      evidence:
        - claim: "Owner-facing claim"
          proof: "The Phase 3 aggregate implementation and proof harness are substantively exit-ready, but the branch is not scope-clean and therefore cannot advance to the final exit decision."
        - claim: "Proof provenance"
          proof: "T005 records every required Phase 0-3 command, two complete verify:phase3 runs, and a successful SHA-256 comparison. The current aggregate receipt is generated by packages/phase3-proof/src/aggregate.test.ts and has SHA-256 59aaa1b84dd52abd4110c4d91acb828533d0c70f7786b896e8b0b0f77c4f9dfe."
        - claim: "Ten-invariant matrix"
          proof: "Fresh protocol/parity, service, recovery, branch/claim, import, determinism, browser, native Chrome, visual, private, reduced-motion, privacy, and protected-path evidence directly supports invariants 1 through 10."
        - claim: "Failure mode 1 — omitted or simulated gates"
          proof: "verify:phase3 now expands through every required suite; the remaining defect is an unauthorized evidence writer discovered by test:unit."
        - claim: "Failure mode 2 — deterministic drift"
          proof: "Two internal equal-base repetitions and two complete aggregate runs produced equal aggregate receipt hashes; private visual evidence records three equal replay and compiler digest sequences."
        - claim: "Failure mode 3 — private or out-of-scope leakage"
          proof: "Fresh scans report zero findings, all private targets ignored, zero tracked private targets, no database/raster artifacts, and no protected product-path diff."
        - claim: "Exact unauthorized side effect"
          proof: "docs/evidence/t002-phase2-target-selection.json differs from f4e1368 only at repeatability.consecutiveFocusedPasses, changing 4 to 5. test:unit excludes **/visual.test.ts but not authoring.visual.test.ts."
      parallel_safety:
        safe: false
        reason: "Use one Worker because package discovery, exact historical restoration, both aggregate repetitions, and the final tracked-diff comparison form one provenance chain."
      blocked_tasks:
        - T999
      missing_evidence:
        - "Exact restoration of docs/evidence/t002-phase2-target-selection.json to its f4e1368 bytes."
        - "A test:unit run proving no visual evidence writer is discovered."
        - "Two fresh complete verify:phase3 runs proving the restored historical receipt remains byte-identical while the aggregate receipt remains byte-identical."
        - "A final clean inventory showing no new content change outside the bounded proof files."
      required_board_updates:
        - "Create one replacement Worker with the exact restoration, unit-exclusion, repeated-gate, privacy, and scope contract."
        - "After it succeeds, run a narrow independent scope-and-provenance Judge before T999."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Resolve the missing-private-manifest recovery path read-only and define a safe replacement Worker contract without weakening private acceptance."
    inputs:
      - "T001 approved proof contract"
      - "T002 blocked receipt"
      - "Owner-provided private corpus paths from the original request"
      - "Existing ignored manifest conventions and private acceptance tests"
    constraints:
      - "Read-only; do not create the manifest or edit product, proof, or board files."
      - "Inspect only exact known repository worktrees, ignored-manifest conventions, and owner-authorized private paths."
      - "Never print private source, copy, branding, selectors, absolute corpus paths, screenshots, or payloads in the receipt."
      - "Prefer reusing an existing ignored manifest; otherwise define the smallest safe local-only manifest creation contract."
      - "Preserve every T002 proof requirement and stop condition except the now-grounded local provisioning step."
    expected_output:
      - "Whether an existing ignored manifest is safely reusable"
      - "Exact sanitized manifest contract and local-only allowed path if reconstruction is required"
      - "Replacement Worker objective, allowed_files, verify, and stop_if"
      - "Evidence that the recovery does not track or copy private content"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "An existing owner-authorized manifest is safely reusable. The completed Phase 0 worktree and five completed Phase 2 worktrees hold byte-identical ignored manifests; each has exactly the two expected fields, references existing regular source/lock files, and resolves four unique confined resources whose recorded digests match. The aggregate worktree alone lacks the manifest. Approve one replacement Worker that restores the Phase 0 manifest byte-for-byte as an ignored regular local file, validates it without printing values, and then executes the complete unchanged T002 proof vertical. No corpus expansion, private copying, product behavior, dependency, or Phase 4 work is authorized."
      evidence:
        - claim: "Reusable manifest provenance"
          proof: "The completed Phase 0 worktree contains an ignored regular manifest previously accepted by completed private-import, visual, receipt, ignore, and sensitive-content gates."
        - claim: "Cross-worktree identity"
          proof: "Six completed Phase 0/2 worktrees contain byte-identical manifests with identical referenced source and resource-lock digests; the primary and Phase 3 worktrees do not contain one."
        - claim: "Manifest and resource validity"
          proof: "Each reusable manifest has exactly sourcePath and resourceLockPath string fields; both targets are existing regular files. The lock resolves four unique resources confined beneath its lock directory, and every recorded resource digest matches current bytes."
        - claim: "Local-only safety"
          proof: "Repository policy ignores .private-corpus/, .motion/, and artifacts/; the tracked inventory contains none of those paths. Prior reuse receipts report zero sensitive findings and no copied private source or resources."
      parallel_safety:
        safe: false
        reason: "Use one Worker. Manifest provisioning and aggregate proof share one provenance chain, command expansion, and deterministic receipt; splitting them would make the private-input and repeated-run evidence ambiguous."
      blocked_tasks:
        - T003
        - T999
      missing_evidence:
        - "The reusable manifest has not yet been restored in the aggregate worktree."
        - "No replacement Worker diff or fresh complete acceptance run exists."
        - "No byte-identical two-run aggregate receipt or independently reviewed ten-invariant matrix exists."
        - "Installed-Chrome diagnostic strengthening and worktree-local Playwright metadata correction remain unimplemented and unverified."
      required_board_updates:
        - "Mark T004 done with this receipt."
        - "Supersede blocked T002 with one active replacement Worker using the exact package in this receipt; keep T002 as historical blocked evidence."
        - "Keep T003 and T999 queued until the replacement Worker completes, and point T003 at the replacement Worker diff, receipts, and fresh command outputs."
  - id: T005
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Restore the exact owner-authorized ignored manifest from the completed Phase 0 sibling worktree as a byte-identical regular local file without printing its contents; validate its referenced inputs privately; then complete the entire T002 proof-only Phase 3 aggregate vertical, including two identical-base editor/CLI repetitions, strengthened installed-Chrome diagnostics, every Phase 0-3 acceptance gate, and one byte-stable sanitized ten-invariant receipt, without changing product behavior."
    allowed_files:
      - .private-corpus/manifest.json
      - package.json
      - apps/editor/scripts/qa-chrome.mjs
      - packages/phase3-proof/src/aggregate.test.ts
      - packages/visual-proof/src/authoring.visual.test.ts
      - packages/visual-proof/src/private.private.test.ts
      - packages/visual-proof/src/receipt.private.test.ts
      - docs/evidence/t002-phase3-aggregate.json
    verify:
      - test -f ../phase0-readonly-phase1/.private-corpus/manifest.json && test -f .private-corpus/manifest.json && cmp .private-corpus/manifest.json ../phase0-readonly-phase1/.private-corpus/manifest.json
      - >-
        node -e 'const fs=require("node:fs"); const p=".private-corpus/manifest.json";
        const m=JSON.parse(fs.readFileSync(p,"utf8")); const valid=fs.lstatSync(p).isFile() &&
        Object.keys(m).sort().join(",")==="resourceLockPath,sourcePath" && typeof m.sourcePath==="string" &&
        typeof m.resourceLockPath==="string" && fs.statSync(m.sourcePath).isFile() &&
        fs.statSync(m.resourceLockPath).isFile(); if(!valid) process.exit(1)'
      - git check-ignore --quiet --no-index .private-corpus/manifest.json && test -z "$(git ls-files -- .private-corpus/manifest.json)" && test -z "$(git ls-files --others --exclude-standard -- .private-corpus)"
      - npm run test:phase3:service
      - npm run test:phase3:recovery
      - npm run test:phase3:parity
      - npm run test:phase3:browser
      - npm run qa:chrome
      - npm run test:unit
      - npm run verify:determinism
      - npm run test:visual
      - npm run test:visual:authoring
      - npm run test:private-acceptance
      - npm run verify:receipts
      - npm run typecheck
      - npm run build
      - npm run check:sensitive && npm run check:private-ignore && git diff --check && git status --short
      - >-
        proof_tmp=$(mktemp -d) && npm run verify:phase3 && shasum -a 256
        docs/evidence/t002-phase3-aggregate.json | awk '{print $1}' > "$proof_tmp/run1.sha" && npm run
        verify:phase3 && shasum -a 256 docs/evidence/t002-phase3-aggregate.json | awk '{print $1}' >
        "$proof_tmp/run2.sha" && cmp "$proof_tmp/run1.sha" "$proof_tmp/run2.sha"
      - git diff --exit-code f4e1368 -- package-lock.json AGENTS.md docs/architecture/phase3-persistence-boundary.md docs/incubation-plan.md fixtures apps/editor/src packages/css-import/src packages/css-compiler/src packages/domain/src packages/local-service/src packages/motion-cli/src packages/motion-protocol/src packages/preview-runtime/src packages/project-store/src
      - git diff --name-only f4e1368
    stop_if:
      - "The completed Phase 0 source manifest is unavailable, differs from the independently matching completed copies, is not a regular file, or no longer references existing regular inputs."
      - "The destination cannot be an exact byte copy, remain ignored and untracked, or requires printing manifest values in commands or receipts."
      - "Provisioning would copy private source, resources, screenshots, generated payloads, databases, or any corpus material beyond the manifest itself."
      - "Any correction requires product implementation, protocol/domain/storage semantics, migration history, dependencies, package-lock, or Phase 4+ behavior."
      - "A proof failure repeats twice for the same product cause; return the exact failure and pre/post evidence for Judge re-contracting."
      - "The aggregate receipt cannot exclude raw copy, HTML/CSS, selectors, URLs, absolute paths, credentials, capabilities, tokens, database locations, timestamps, screenshots, event payloads, and nondeterministic operation IDs/timing samples."
      - "Installed Google Chrome cannot be launched or Chrome evidence shows a console error, uncaught exception, failed request, or non-allowlisted network activity."
      - "Private acceptance would require tracking or copying private source, branding, paths, screenshots, SQLite/WAL/backup/discovery files, or payload-bearing receipts."
      - "Any file outside allowed_files changes, including board state; stop and report the exact path."
      - "Do not weaken, skip, or conditionally pass a required acceptance assertion because private inputs or browser metadata are missing; report unavailable evidence explicitly."
    receipt:
      result: blocked
      changed_files:
        - .private-corpus/manifest.json
        - package.json
        - apps/editor/scripts/qa-chrome.mjs
        - packages/phase3-proof/src/aggregate.test.ts
        - packages/visual-proof/src/authoring.visual.test.ts
        - packages/visual-proof/src/private.private.test.ts
        - packages/visual-proof/src/receipt.private.test.ts
