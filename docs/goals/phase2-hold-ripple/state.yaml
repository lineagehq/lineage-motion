      - "Choose one exact canonical cue/boundary and enumerate every affected/unaffected object and timestamp."
      - "Define one strict typed public operation, exact projection/replay/inverse semantics, collision/overflow/rejection precedence, UI, accessibility, and proof."
      - "Do not authorize generic dragging, arbitrary ripple sets, persistence, or Phase 3."
      - "Return exact Worker allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Go/no-go"
      - "Exact boundary and affected inventory"
      - "Typed operation and deterministic history contract"
      - "UI/native-preview and controlled visual proof contract"
      - "Exact Worker package"
    receipt:
      result: done
      task_id: T001
