version: 2

goal:
  title: "Phase 2 Insert Hold and Ripple Retime"
  slug: "phase2-hold-ripple"
  kind: existing_plan
  tranche: "Insert one 600 ms hold at an approved story boundary and ripple all later canonical timing exactly, then stop before Phase 3."
  status: done
  oracle:
    signal: "Chrome proves one typed 600 ms hold preserves all earlier motion, shifts every approved later cue/track exactly 600 ms in stable order, renders compiler-native output, and reverses/restores exactly."
    cadence: "after implementation and at final audit"
    final_proof: "Final Judge maps domain/compiler/history, installed Chrome, controlled visual boundary, privacy/build, and diff evidence to the oracle with full_outcome_complete true."
  intake:
    original_request: "Proceed with the recommended UX simplification and then the insert-hold/ripple-retime Phase 2 milestone."
    interpreted_outcome: "Extend the reveal/typing beat by 600 ms without editing CSS and preserve every later story relationship."
    input_shape: existing_plan
    audience: "CSS animation authors"
    authority: approved
    proof_type: demo
    completion_proof: "Visible and controlled Chrome prove exact 600 ms ripple, native preview, and reversible history."
    likely_misfire: "Implement generic timeline dragging or percentage shifting rather than one canonical story-time operation."
    blind_spots_considered:
      - "The hold boundary must be semantically unambiguous and derived from canonical cues/tracks."
      - "Discrete and step boundaries require t-1/t/t+1 visual sampling before and after ripple."
      - "Applications with delays, simultaneous tracks, and later cues must retain relative order."
      - "Duration, cue times, keyframe offsets, slot delays, and expanded projections must remain internally consistent."
    existing_plan_facts:
      - "Target selection and UX simplification are integrated locally through 6e9b4c3."
      - "Phase 2 exit test specifies extending the typing/reveal beat by 600 ms while preserving later story order."
      - "Phase 3 remains unauthorized until this gate passes."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: starting
    url: "http://goalbuddy.localhost:41737/phase2-hold-ripple/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase2-hold-ripple"

active_task: null

