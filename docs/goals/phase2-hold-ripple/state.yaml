    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate and specify the exact largest safe 600 ms insert-hold/ripple-retime vertical slice against the current canonical document, typed reducer, simplified editor, compiler, and visual-proof contracts."
