      - "git diff --exit-code 1c7eb03 -- docs/incubation-plan.md docs/architecture.md fixtures packages package.json package-lock.json docs/evidence/t002-phase2-target-selection.json"
      - "git diff 1c7eb03 --check"
      - "git diff --name-only 1c7eb03"
      - "git status --short"
    stop_if:
      - "Need any file outside allowed_files."
      - "Need a new or changed domain operation, canonical field, eligibility rule, importer/compiler/preview-runtime behavior, fixture, dependency, or document schema."
      - "Need hold, ripple-retime, drag editing, arbitrary CSS, persistence, branching, claims, CLI/MCP, Lineage integration, video, publication, or another later-phase capability."
      - "Simplification would remove an editing action, timeline/keyframe/cue fact, stable identity, reduced-motion inspection, compiler-native preview, or exact history instead of subordinating it."
