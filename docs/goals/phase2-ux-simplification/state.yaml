    status: blocked
    reasoning_hint: medium
    objective: "Implement one complete first-time-author UX simplification: a plain-language Choose/Create/Shape/Time workflow beside a prominent compiler-native preview, truthful draft-versus-applied timing, predictable focus/history/validation, responsive layouts, and collapsed but complete technical inspection, without changing any capability or canonical behavior."
    allowed_files:
      - "apps/editor/src/main.ts"
