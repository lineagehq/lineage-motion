version: 2

goal:
  title: "Phase 2 UX Simplification"
  slug: "phase2-ux-simplification"
  kind: existing_plan
  tranche: "Simplify the proven target-selection authoring workflow without adding capabilities, then stop for owner review."
  status: done
  oracle:
    signal: "Fresh Chrome proves a first-time author can complete Choose, Create, Shape, Time, Preview, validation, and exact history without coaching while technical topology remains inspectable but subordinate."
    cadence: "after the Worker package and at final audit"
    final_proof: "A final Judge maps visible browser QA, focused tests, full regression, visual/private proof, accessibility, build, and diff evidence to every grounded UX criterion and records full_outcome_complete: true."
  intake:
    original_request: "Do a round of UX simplification, then continue the planned sequence."
    interpreted_outcome: "Make the current bounded CSS-animation authoring workflow substantially easier to understand and operate before adding further Phase 2 capabilities."
    input_shape: existing_plan
    audience: "First-time CSS animation authors"
    authority: approved
    proof_type: demo
    completion_proof: "A fresh visible walkthrough completes the current authoring workflow first try without coaching or material friction."
    likely_misfire: "Polish colors or hide information without improving task comprehension, or mix simplification with new Phase 2/3 capabilities."
    blind_spots_considered:
      - "Draft inputs must be distinguishable from applied canonical state."
      - "Preview should remain prominent during authoring."
      - "Keyboard order, focus continuity, reduced motion, and screen-reader clarity must survive layout changes."
      - "The full timeline and IDs must remain inspectable without dominating the default experience."
      - "Tests must judge first-time comprehension and not only DOM availability."
    existing_plan_facts:
      - "The target-selection slice is integrated locally at 1c7eb03."
      - "Hold/ripple-retime is the next major Phase 2 capability after this UX tranche."
      - "Phase 3 persistence/service/CLI work remains out of scope."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/phase2-ux-simplification/"
    command: "node <goalbuddy-skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/phase2-ux-simplification"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Adversarially audit the current editor and visible workflow, then define the exact largest safe UX-simplification Worker package that improves first-time comprehension without changing capability or canonical behavior."
    inputs:
      - "docs/incubation-plan.md"
      - "docs/browser-qa-loop.md"
      - "docs/goals/phase2-target-selection-slice/state.yaml"
      - "Current editor implementation, styles, tests, and Chrome QA"
      - "Fresh visible browser inspection at the local editor subdomain"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the existing plan, product invariants, private-corpus rules, and Phase 2 boundary."
      - "Prioritize task comprehension, creative control, preview prominence, validation, history, keyboard/focus, and responsive behavior over aesthetic novelty."
      - "Keep technical evidence inspectable but subordinate."
      - "Do not authorize new operations, importer/compiler/domain schema changes, or hold/ripple-retime."
      - "Return exact Worker allowed_files, verification commands, stop conditions, and first-time walkthrough script."
    expected_output:
      - "Go/no-go and ranked concrete friction findings"
      - "Exact information architecture and interaction contract"
      - "Exact responsive/accessibility and draft/applied-state contract"
      - "Exact Worker package and proof commands"
    receipt:
      result: done
      task_id: T001
      decision: approved
      full_outcome_complete: false
      rationale: "Approved as one vertical UI slice. Fresh browser evidence shows the operations work, but the interface misstates fresh selection, scrolls away from the next action after creation, exposes unapplied timing as current, overweights canonical topology, and fails narrow layouts. Corrections stay in editor markup, styles, and browser proof with no domain/compiler/schema/capability changes."
      ranked_friction:
        - "Fresh state falsely claims an unrelated Status-copy keyframe selection."
        - "Creation scrolls roughly 714 px into the technical timeline, hiding newly enabled Shape/Time controls."
        - "Visible 1400/700 timing drafts disagree with applied 1000/610 canonical timing."
        - "A 768 px viewport produces 1367 px document width."
        - "Three actions share the accessible name Apply."
        - "Canonical IDs and full topology dominate the creative workflow."
      approved_contract: "Plain-language Choose/Create/Shape/Time workflow beside prominent Preview; truthful draft-versus-applied timing; intentional focus/history/rejection; responsive 1440/768/390 layouts; complete technical inspection collapsed by default."
      parallel_safety:
        safe: false
        reason: "Markup, CSS, browser tests, and installed-Chrome proof share selectors and interaction contracts."
      missing_evidence:
        - "Implementation, responsive/focus/draft-state proof, visible walkthrough, installed Chrome, and complete regression evidence remain."

