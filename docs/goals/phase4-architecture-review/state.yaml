        - "Read the incubation plan and enumerate merged architecture/evidence surfaces."
        - "Inspect merged architecture, persistence boundary, and aggregate evidence."
        - "Compute sanitized five-scene structural, animation, property, timing, diagnostic, and candidate inventories."
        - "Map importer, domain, compiler, preview, service, editor, proof, and receipt boundaries."
