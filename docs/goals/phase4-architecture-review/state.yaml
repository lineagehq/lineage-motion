      - "Inspect private scenes locally but never reproduce source, copy, branding, selectors, filenames, screenshots, absolute paths, or payloads."
      - "Report scenes only as sanitized stable aliases and technical counts/capabilities."
      - "Separate imported facts, inferred cue candidates, and unsupported constructs; never treat heuristic cue recognition as canonical truth."
      - "Preserve native CSS output, compiler-backed preview, stable IDs, deterministic receipts, fail-closed import, sole writer, revision, claim, and reduced-motion invariants."
      - "Exclude landing-scene work, Phase 5+, generalized constraints, merge/review workflow, publication, MCP, and Lineage integration."
    expected_output:
      - "Five-scene sanitized technical inventory and capability matrix"
      - "Ranked composable gaps versus merged Phase 3"
      - "Candidate scene matching cursor plus click plus reveal"
      - "Evidence boundaries for cue inference, private data, and visual proof"
      - "Exact repo areas and verification surfaces the architecture must address"
    receipt:
      result: done
      summary: "Inspected exactly five owner-authorized scenes and mapped them to merged Phase 3. All currently fail closed. Scene D is the smallest sanitized cursor-plus-click-pulse-plus-reveal candidate. Phase 3 already proves typed operations, sole-writer revisions/claims, deterministic native CSS, compiler-backed preview, privacy-safe receipts, reduced motion, and discrete visual sampling. Phase 4 gaps are cue-owned track materialization/detachment, cursor/click authoring, breadth import blockers, reusable cue semantics, revision-linked notes/comparison, sanitized handoff, and paired performance evidence. Cue classifications remain explicitly heuristic and noncanonical."
      evidence:
        - kind: private_corpus_inventory
          scope: "exactly five scenes"
          alias_stability: "Scene A-E assigned by deterministic corpus ordering for this inventory snapshot"
          scenes: "[object Object],[object Object],[object Object],[object Object],[object Object]"
        - kind: inferred_cue_candidates
          canonical: false
          boundary: "Technical patterns identify review candidates only; no cue meaning may be assigned or persisted without explicit author confirmation."
          scenes: "[object Object],[object Object],[object Object],[object Object],[object Object]"
        - kind: first_slice_candidate
          alias: "Scene D"
          basis: "smallest DOM inventory,nine keyframe rules,position-based cursor travel candidate,transform pulse candidate,opacity reveal candidate,steps timing pressures discrete proof"
          qualification: "Sanitized architectural candidate only; browser inspection must confirm target identity, click press/release boundaries, synchronized reveal, and absence of omitted constructs before implementation."
        - kind: merged_phase3_receipt
          passed: true
          proofs: "editor/CLI byte parity,repeated-run byte identity,sole persistent writer,atomic expected revisions,claim-bounded agent writes,selector-independent identity,fail-closed import,compiler-backed preview,native HTML/CSS output,reduced-motion inspection"
          browser_thresholds: "[object Object]"
          visual_thresholds: "[object Object]"
        - kind: architecture_surface_map
          areas: "[object Object],[object Object],[object Object],[object Object],[object Object],[object Object],[object Object],[object Object]"
      facts:
        - rank: 1
          gap: "All five real scenes currently fail closed; architecture must distinguish materializable external-resource handling from prohibited live loading, repair or explicitly block Scene B's missing rule, decide transition treatment for Scene C, and keep Scene E pseudo-element motion unsupported because it belongs to Phase 5 unless separately authorized."
        - rank: 2
          gap: "The current cue model is only an ID, label, and time; it lacks cue kind, targets, named moments, parameters, generator version, generated-track IDs, expansion digest, ownership lock, and deterministic detach/undo."
        - rank: 3
          gap: "No typed cursor-path or click press/release/pulse operation exists. Geometry, coordinate space, target anchoring, pulse timing, synchronized reveal, stale-revision behavior, and unaffected-track proof require contracts."
        - rank: 4
          gap: "Reusable click/type/select/drag/reveal/hold authoring semantics are absent. Existing hold support is intentionally fixture-specific and cannot serve as the generalized Phase 4 contract."
        - rank: 5
          gap: "Revision-linked annotations, comparison, sanitized handoff receipts, and paired active-time instrumentation are absent; notes must remain outside canonical/export identity and limited to open/resolved state."
        - claim: "A privacy-safe five-scene inventory identifies composable Phase 4 pressure without treating private-source heuristics as truth."
          top_failure_modes: "cue metadata and generated tracks drift into dual authority or a second runtime,import diagnostics or heuristic cue recognition silently omit constructs or leak private material,the selected candidate appears simple by counts but browser inspection reveals unsynchronized interaction boundaries or unsupported behavior"
        - source_fact_boundary: "Counts, property categories, timing constructs, importer inventories, and diagnostic codes are directly observed source/import facts."
        - inference_boundary: "Cue labels and the first-slice match are candidates inferred from technical patterns; they require explicit authoring confirmation and browser evidence."
        - privacy_boundary: "No source, copy, branding, selector, URL, filename, screenshot, payload, or private note body is included. Future visual proof should retain only sanitized sample labels, timing boundaries, counts, and digests."
      contradictions:
        - issue: "Phase 4 requires importing all five scenes, but every current import returns no canonical document."
          impact: "Breadth architecture must explicitly close or preserve each diagnostic; it cannot claim current import readiness."
        - issue: "Scene E contains pseudo-element motion while the current tranche excludes Phase 5 pseudo-element breadth."
          impact: "Phase 4 must fail visibly or define a sanitized exclusion; it must not silently drop or implement the deferred construct."
        - issue: "The existing hold schema is hard-coded to one cue, time, and duration while Phase 4 calls for reusable hold cues."
          impact: "Architecture must replace fixture-specific semantics through a versioned general contract without invalidating deterministic projection proof."
      ambiguity_requiring_judge:
        - question: "Does import all five permit locally materialized, digest-locked external-resource preprocessing, or must external resources be rejected and replaced before canonical import?"
        - question: "Should Scene C's transition remain explicitly unsupported, or be normalized only with proof that it is motion-irrelevant?"
        - question: "How should Scene E count toward Phase 4 while its pseudo-element motion is deferred to Phase 5?"
        - question: "What confidence/evidence vocabulary may cue candidates expose while guaranteeing they never mutate canonical meaning?"
