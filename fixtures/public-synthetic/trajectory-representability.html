<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trajectory representability proof</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    .stage { position: relative; width: 320px; height: 180px; overflow: hidden; background: #f1f4f8; }
    .target { position: absolute; width: 36px; height: 36px; border-radius: 8px; }
    .target-a { background: #315bd6; animation: precise-a 2100ms linear 0ms 1 normal both running; }
    .target-b { background: #c14f28; animation: precise-b 2100ms linear 0ms 1 normal both running; }
    @keyframes precise-a {
      0% { transform: translate(0, 24px) scale(1) rotate(0deg); }
      33.333333333333333% { transform: translate(112px, 72px) scale(1.08) rotate(6deg); }
      100% { transform: translate(136px, 78px) scale(1) rotate(0deg); }
    }
    @keyframes precise-b {
      0% { transform: translate(272px, 0) scale(1) rotate(0deg); }
      33.333333333333333% { transform: translate(176px, 76px) scale(.94) rotate(-5deg); }
      100% { transform: translate(152px, 82px) scale(1) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { .target { animation: none; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Synthetic trajectory stage">
    <div class="target target-a" aria-label="Target A"></div>
    <div class="target target-b" aria-label="Target B"></div>
  </main>
</body>
</html>
