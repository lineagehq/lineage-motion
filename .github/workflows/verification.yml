name: Verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check:line-limit
      - run: npm run check:verification-manifest
      - run: npm run check:execution-artifacts
      - run: node scripts/run-verification.mjs --suite policy-tests --suite fast-unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-verification.mjs --suite repository-safety --suite service-integration --suite acquisition

  recovery-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-verification.mjs --suite recovery --suite parity

  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-verification.mjs --suite determinism

  visual-preprocessor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-verification.mjs --suite public-visual-preprocessor

  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-verification.mjs --suite public-visual-proof

  determinism-visual:
    if: always()
    needs: [determinism, visual-preprocessor, visual-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every determinism and visual shard
        run: |
          test "${{ needs.determinism.result }}" = success
          test "${{ needs.visual-preprocessor.result }}" = success
          test "${{ needs.visual-proof.result }}" = success

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-verification.mjs --suite browser

  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-verification.mjs --suite typecheck --suite build --suite privacy-checks
