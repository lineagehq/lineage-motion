name: Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-undo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d2ae9d99f1e457332ad3911214c3d5da15c53c2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record source and runtime
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          node --input-type=module -e 'import {chromium} from "@playwright/test"; const b=await chromium.launch(); console.log(JSON.stringify({browser:await b.version(),node:process.version,arch:process.arch,platform:process.platform})); await b.close();'
      - name: Five Start and Landed pairs
        run: npx playwright test --config apps/editor/playwright.config.ts apps/editor/tests/project-entry.spec.ts --grep 'chosen source pause' --repeat-each=5 --reporter=line
      - if: failure()
        run: node --import tsx scripts/stage-browser-diagnostics.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bounded-undo-diagnostics
          path: artifacts/safe-browser-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
